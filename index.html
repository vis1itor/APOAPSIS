<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>APOAPSIS · Telegram style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f0f;
      font-family: 'Dela Gothic One', cursive, sans-serif;
      padding: 12px;
      margin: 0;
    }

    /* ===== ОСНОВНАЯ КАРТОЧКА — КАК ТЕЛЕГРАМ ===== */
    .messenger {
      max-width: 480px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 700px;
      max-height: 95vh;
      position: relative;
    }

    /* ===== ШАПКА ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
      background: #1a1a1a;
      z-index: 2;
    }

    .logo {
      font-family: 'Dela Gothic One', cursive;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #e8ffe8;
      background: rgba(40, 160, 40, 0.06);
      padding: 0 14px 0 10px;
      border-radius: 40px;
      border: 1px solid rgba(80, 220, 80, 0.04);
      line-height: 1.4;
      display: inline-block;
    }

    .status-badge {
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.65rem;
      background: rgba(255, 255, 255, 0.02);
      color: #6a8f6a;
      padding: 4px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
    }

    /* ===== БЛОК АВТОРИЗАЦИИ ===== */
    .auth-area {
      padding: 14px 20px 12px 20px;
      background: #141414;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      flex-shrink: 0;
    }

    .auth-area .auth-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .auth-area input {
      flex: 1;
      min-width: 100px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      padding: 10px 16px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.75rem;
      color: #d4e8d4;
      outline: none;
      transition: 0.2s;
    }
    .auth-area input:focus {
      border-color: rgba(80, 220, 80, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }
    .auth-area input::placeholder {
      color: rgba(200, 255, 200, 0.08);
    }

    .auth-btn {
      background: rgba(40, 160, 40, 0.04);
      border: 1px solid rgba(80, 220, 80, 0.04);
      border-radius: 40px;
      padding: 10px 18px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.7rem;
      color: #8ab88a;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .auth-btn:hover {
      background: rgba(40, 200, 40, 0.04);
      border-color: rgba(80, 220, 80, 0.06);
      color: #a8d8a8;
    }
    .auth-btn:active {
      transform: scale(0.95);
    }

    .auth-status {
      font-size: 0.6rem;
      color: rgba(200, 255, 200, 0.15);
      text-align: center;
      letter-spacing: 0.5px;
      padding-top: 8px;
    }
    .auth-status.error {
      color: rgba(255, 150, 150, 0.3);
    }
    .auth-status.success {
      color: rgba(150, 255, 150, 0.2);
    }

    /* ===== ОКНО СООБЩЕНИЙ ===== */
    .messages-window {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
      background: #141414;
    }

    .messages-window::-webkit-scrollbar {
      width: 4px;
    }
    .messages-window::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-window::-webkit-scrollbar-thumb {
      background: rgba(80, 220, 80, 0.05);
      border-radius: 20px;
    }

    /* ===== СООБЩЕНИЯ — КАК В ТЕЛЕГРАМ ===== */
    .message-item {
      font-family: 'Dela Gothic One', cursive;
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 14px;
      border-radius: 16px 16px 16px 4px;
      color: #d4e8d4;
      border-left: 2px solid rgba(80, 220, 80, 0.06);
      word-break: break-word;
      font-size: 0.9rem;
      line-height: 1.5;
      letter-spacing: 0.2px;
      animation: floatIn 0.2s ease-out;
      max-width: 92%;
      align-self: flex-start;
    }

    .message-item strong {
      color: #8fc98f;
      font-weight: 400;
      background: rgba(80, 220, 80, 0.02);
      padding: 0 10px 0 6px;
      border-radius: 20px;
      margin-right: 6px;
      font-size: 0.75rem;
      border: 1px solid rgba(80, 220, 80, 0.02);
    }

    /* Свои сообщения (справа) */
    .message-item.own {
      align-self: flex-end;
      border-left: none;
      border-right: 2px solid rgba(80, 220, 80, 0.08);
      border-radius: 16px 16px 4px 16px;
      background: rgba(40, 160, 40, 0.02);
    }

    .system-message {
      font-family: 'Dela Gothic One', cursive;
      text-align: center;
      color: rgba(180, 230, 180, 0.08);
      padding: 6px 12px;
      font-size: 0.6rem;
      letter-spacing: 1px;
      align-self: center;
      width: 100%;
    }

    @keyframes floatIn {
      0% { opacity: 0.2; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПОЛЕ ВВОДА ===== */
    .input-area {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 16px 14px 16px;
      background: #141414;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 40px;
      padding: 12px 18px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.9rem;
      color: #d4e8d4;
      outline: none;
      transition: 0.2s;
    }
    .input-area input:focus {
      border-color: rgba(80, 220, 80, 0.04);
      background: rgba(255, 255, 255, 0.01);
    }
    .input-area input::placeholder {
      color: rgba(200, 255, 200, 0.05);
      font-size: 0.8rem;
    }
    .input-area input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .input-area button {
      background: rgba(40, 160, 40, 0.02);
      border: 1px solid rgba(80, 220, 80, 0.02);
      border-radius: 40px;
      padding: 12px 24px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 1rem;
      color: #8ab88a;
      cursor: pointer;
      transition: 0.1s;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .input-area button:hover {
      background: rgba(40, 200, 40, 0.02);
      border-color: rgba(80, 220, 80, 0.04);
      color: #a8d8a8;
    }
    .input-area button:active {
      transform: scale(0.94);
    }
    .input-area button:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    @media (max-width: 480px) {
      .messenger { border-radius: 20px; height: 100vh; max-height: 100vh; padding: 0; }
      .header { padding: 14px 16px 10px 16px; }
      .logo { font-size: 1.3rem; }
      .auth-area { padding: 10px 16px; }
      .auth-area input { font-size: 0.65rem; padding: 8px 12px; }
      .auth-btn { font-size: 0.6rem; padding: 8px 12px; }
      .messages-window { padding: 8px 12px; }
      .message-item { font-size: 0.8rem; padding: 6px 12px; }
      .input-area { padding: 8px 12px 12px 12px; }
      .input-area input { font-size: 0.8rem; padding: 10px 14px; }
      .input-area button { font-size: 0.8rem; padding: 10px 16px; }
    }
  </style>
</head>
<body>
  <div class="messenger">
    <!-- ШАПКА -->
    <div class="header">
      <span class="logo">APOAPSIS</span>
      <span class="status-badge" id="authBadge">✦ войдите</span>
    </div>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="auth-area" id="authArea">
      <div class="auth-row">
        <input type="email" id="authEmail" placeholder="почта" autocomplete="email" />
        <input type="password" id="authPassword" placeholder="пароль" autocomplete="current-password" />
      </div>
      <div class="auth-row" style="justify-content: center; margin-top: 6px;">
        <button class="auth-btn" id="authLoginBtn">вход</button>
        <button class="auth-btn" id="authRegisterBtn">регистрация</button>
        <button class="auth-btn" id="authLogoutBtn" style="display:none;">выход</button>
      </div>
      <div class="auth-status" id="authStatus">введите почту и пароль</div>
    </div>

    <!-- СООБЩЕНИЯ -->
    <div id="messageContainer" class="messages-window">
      <div class="system-message">войдите, чтобы писать</div>
    </div>

    <!-- ВВОД -->
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="сообщение..." autocomplete="off" disabled />
      <button id="sendButton" disabled>➤</button>
    </div>
  </div>

  <script type="module">
    // ========== FIREBASE ==========
    import { initializeApp } from 'firebase/app';
    import { getDatabase, ref, push, onChildAdded, get, child } from 'firebase/database';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'firebase/auth';

    const firebaseConfig = {
      apiKey: "AIzaSyBIgCjEVT5BsPbGZqEARSDGvYv_9LclFY8",
      authDomain: "apoapsis-a9024.firebaseapp.com",
      projectId: "apoapsis-a9024",
      storageBucket: "apoapsis-a9024.firebasestorage.app",
      messagingSenderId: "264187106751",
      appId: "1:264187106751:web:712670b22bbaeeb7bcfd0a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);
    const messagesRef = ref(database, 'messages');

    // ========== DOM ==========
    const messageContainer = document.getElementById('messageContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authStatus = document.getElementById('authStatus');
    const authBadge = document.getElementById('authBadge');
    const authLoginBtn = document.getElementById('authLoginBtn');
    const authRegisterBtn = document.getElementById('authRegisterBtn');
    const authLogoutBtn = document.getElementById('authLogoutBtn');

    let currentUser = null;

    // ========== СООБЩЕНИЯ ==========
    function addMessageToDOM(text, isOwn = false, isSystem = false) {
      const msgDiv = document.createElement('div');
      if (isSystem) {
        msgDiv.className = 'system-message';
        msgDiv.textContent = text;
      } else {
        msgDiv.className = 'message-item' + (isOwn ? ' own' : '');
        const names = ['🌱 Apo', '💧 Physis', '🌿 Eco', '🍃 Verd', '✨ Moss'];
        const name = names[Math.floor(Math.random() * names.length)];
        msgDiv.innerHTML = `<strong>${name}</strong> ${text}`;
      }
      messageContainer.appendChild(msgDiv);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    // ========== ПРИЁМ СООБЩЕНИЙ ==========
    onChildAdded(messagesRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.text) {
        if (data.text.startsWith('🔥')) {
          addMessageToDOM(data.text, false, true);
        } else {
          const isOwn = data.uid === currentUser?.uid;
          addMessageToDOM(data.text, isOwn, false);
        }
      }
    });

    // ========== ОТПРАВКА ==========
    function sendMessage() {
      if (!currentUser) {
        authStatus.textContent = '⚠️ войдите, чтобы писать';
        authStatus.className = 'auth-status error';
        return;
      }
      const rawText = messageInput.value.trim();
      if (rawText === '') return;

      push(messagesRef, { text: rawText, uid: currentUser.uid })
        .then(() => {
          messageInput.value = '';
          messageInput.focus();
        })
        .catch((error) => {
          console.error(error);
          addMessageToDOM('⚠️ ошибка', false, true);
        });
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // ========== АВТОРИЗАЦИЯ ==========
    function setAuthUI(user) {
      if (user) {
        currentUser = user;
        authBadge.textContent = `✦ ${user.email}`;
        authBadge.style.color = '#8fc98f';
        messageInput.disabled = false;
        sendButton.disabled = false;
        authLoginBtn.style.display = 'none';
        authRegisterBtn.style.display = 'none';
        authLogoutBtn.style.display = 'inline-block';
        authStatus.textContent = '✅ в сети';
        authStatus.className = 'auth-status success';
        // Удаляем системное сообщение
        const first = messageContainer.firstChild;
        if (first && first.classList && first.classList.contains('system-message') && first.textContent.includes('войдите')) {
          first.remove();
        }
        // Приветствие
        if (!localStorage.getItem('apo_welcome_' + user.uid)) {
          push(messagesRef, { text: '🔥 ' + user.email + ' присоединился', uid: 'system' })
            .then(() => localStorage.setItem('apo_welcome_' + user.uid, 'true'))
            .catch(() => {});
        }
      } else {
        currentUser = null;
        authBadge.textContent = '✦ войдите';
        authBadge.style.color = '#6a8f6a';
        messageInput.disabled = true;
        sendButton.disabled = true;
        authLoginBtn.style.display = 'inline-block';
        authRegisterBtn.style.display = 'inline-block';
        authLogoutBtn.style.display = 'none';
        authStatus.textContent = 'введите почту и пароль';
        authStatus.className = 'auth-status';
        messageContainer.innerHTML = '<div class="system-message">войдите, чтобы писать</div>';
      }
    }

    authRegisterBtn.addEventListener('click', () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) {
        authStatus.textContent = '⚠️ заполните поля';
        authStatus.className = 'auth-status error';
        return;
      }
      if (password.length < 6) {
        authStatus.textContent = '⚠️ пароль >= 6 символов';
        authStatus.className = 'auth-status error';
        return;
      }
      createUserWithEmailAndPassword(auth, email, password)
        .then((cred) => {
          authStatus.textContent = '✅ регистрация успешна';
          authStatus.className = 'auth-status success';
          setAuthUI(cred.user);
        })
        .catch((error) => {
          authStatus.textContent = '⚠️ ' + error.message;
          authStatus.className = 'auth-status error';
        });
    });

    authLoginBtn.addEventListener('click', () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) {
        authStatus.textContent = '⚠️ заполните поля';
        authStatus.className = 'auth-status error';
        return;
      }
      signInWithEmailAndPassword(auth, email, password)
        .then((cred) => {
          authStatus.textContent = '✅ вход выполнен';
          authStatus.className = 'auth-status success';
          setAuthUI(cred.user);
        })
        .catch((error) => {
          authStatus.textContent = '⚠️ ' + error.message;
          authStatus.className = 'auth-status error';
        });
    });

    authLogoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        authStatus.textContent = '👋 вы вышли';
        authStatus.className = 'auth-status';
        setAuthUI(null);
      });
    });

    onAuthStateChanged(auth, (user) => {
      setAuthUI(user);
    });

    console.log('🌿 APOAPSIS · Telegram style');
  </script>
</body>
</html>
