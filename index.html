<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liquid Messenger · WebRTC</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #0b0e14; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .glass-wrapper {
      width: 100%; max-width: 480px; height: 760px;
      background: rgba(20,25,32,0.45); backdrop-filter: blur(14px); border-radius: 38px;
      border: 1px solid rgba(0,255,150,0.12); padding: 16px 14px;
      display: flex; flex-direction: column; position: relative;
    }
    .app-container { display: flex; flex: 1; gap: 12px; min-height: 0; margin: 14px 0 16px 0; }
    .contacts-panel {
      width: 110px; background: rgba(16,22,28,0.3); backdrop-filter: blur(8px);
      border-radius: 24px; border: 1px solid rgba(0,255,150,0.08);
      padding: 12px 8px; overflow-y: auto; flex-shrink: 0;
      display: flex; flex-direction: column; gap: 6px;
    }
    .contacts-panel::-webkit-scrollbar { width: 3px; }
    .contacts-panel::-webkit-scrollbar-thumb { background: #2b5e4a; border-radius: 20px; }
    .panel-title { font-size: 10px; color: #3a5a4a; text-align: center; padding-bottom: 8px; border-bottom: 1px solid rgba(0,255,150,0.05); text-transform: uppercase; }
    .contact-item-panel {
      display: flex; flex-direction: column; align-items: center; padding: 8px 4px;
      border-radius: 16px; cursor: pointer; transition: 0.2s; position: relative;
      border: 1px solid transparent; gap: 4px;
    }
    .contact-item-panel:hover { background: rgba(0,255,150,0.05); }
    .contact-item-panel.active { background: rgba(0,255,150,0.1); border-color: rgba(0,255,150,0.15); }
    .contact-avatar-panel {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(145deg,#1e2a2e,#0f171c);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(0,255,150,0.15);
      color: #a0f0c0; font-weight: 600; font-size: 18px;
    }
    .contact-item-panel.active .contact-avatar-panel { border-color: #27e07b; }
    .contact-name-panel { font-size: 10px; color: #8baa9a; text-align: center; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .contact-call-btn {
      position: absolute; bottom: 4px; right: 4px;
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(0,220,130,0.2); border: 1px solid rgba(0,255,150,0.15);
      color: #76c9a0; font-size: 10px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s;
    }
    .contact-call-btn:hover { background: rgba(0,220,130,0.3); transform: scale(1.1); }
    .add-contact-btn-panel {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,220,130,0.1); border: 2px dashed rgba(0,255,150,0.15);
      color: #76c9a0; font-size: 24px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; margin: 4px auto 0;
    }
    .add-contact-btn-panel:hover { background: rgba(0,220,130,0.2); transform: scale(1.05); }
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header {
      display: flex; align-items: center; gap: 10px; padding-bottom: 10px;
      border-bottom: 1px solid rgba(0,255,150,0.1); flex-shrink: 0;
    }
    .chat-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(145deg,#1e2a2e,#0f171c);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(0,255,150,0.15);
      color: #a0f0c0; font-weight: 600; font-size: 16px;
    }
    .chat-info { flex: 1; min-width: 0; }
    .chat-info h2 { font-size: 16px; font-weight: 600; color: #eef5f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-info span { font-size: 11px; color: #76c9a0; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
    .online-dot { display: inline-block; width: 6px; height: 6px; background: #27e07b; border-radius: 10px; }
    .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .header-btn {
      background: rgba(0,255,150,0.08); border: 1px solid rgba(0,255,150,0.1);
      color: #9edbbd; padding: 4px 10px; border-radius: 20px; font-size: 11px;
      cursor: pointer; transition: 0.2s; white-space: nowrap;
    }
    .header-btn:hover { background: rgba(0,255,150,0.15); }
    .header-btn.call-btn { background: rgba(0,220,130,0.15); border-color: rgba(0,255,150,0.2); color: #b3f0d0; }
    .header-btn.call-btn:hover { background: rgba(0,220,130,0.25); }
    .messages-area {
      flex: 1; overflow-y: auto; margin: 10px 0; padding-right: 4px;
      display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
    }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-thumb { background: #2b5e4a; border-radius: 20px; }
    .message-wrapper { display: flex; gap: 8px; align-items: flex-start; max-width: 92%; }
    .message-wrapper.own { align-self: flex-end; flex-direction: row-reverse; }
    .message-wrapper.other { align-self: flex-start; flex-direction: row; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(145deg,#1e2a2e,#0f171c);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(0,255,150,0.1);
      color: #a0f0c0; font-weight: 600; font-size: 12px;
    }
    .message-content { flex: 1; min-width: 0; }
    .msg-sender-name { font-size: 11px; font-weight: 600; color: #7bcfa8; margin-bottom: 2px; display: block; }
    .message-wrapper.own .msg-sender-name { text-align: right; color: #5a9a7a; }
    .message {
      padding: 8px 12px; border-radius: 16px; font-size: 14px; line-height: 1.4;
      backdrop-filter: blur(8px); background: rgba(30,40,45,0.45);
      border: 1px solid rgba(0,255,150,0.06); color: #e2efe8;
      animation: fadeSlide 0.2s ease; display: inline-block;
    }
    .message-wrapper.own .message { background: rgba(0,200,120,0.15); border-color: rgba(0,255,150,0.15); color: #daffec; }
    .message .msg-time { display: block; font-size: 9px; margin-top: 4px; opacity: 0.4; color: #8baa9a; text-align: right; }
    @keyframes fadeSlide { 0% { opacity: 0.3; transform: translateY(4px); } 100% { opacity: 1; transform: translateY(0); } }
    .input-area {
      display: flex; gap: 8px; align-items: center;
      background: rgba(16,22,28,0.5); backdrop-filter: blur(12px);
      border-radius: 48px; padding: 4px 4px 4px 16px;
      border: 1px solid rgba(0,255,150,0.1); flex-shrink: 0;
    }
    .input-area input { flex: 1; background: transparent; border: none; outline: none; color: #d4e8dd; font-size: 15px; padding: 10px 0; }
    .input-area input::placeholder { color: #5a7a6a; }
    .input-area button {
      background: rgba(0,220,130,0.12); border: 1px solid rgba(0,255,150,0.15);
      color: #b3f0d0; padding: 8px 16px; border-radius: 40px;
      font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .input-area button:hover { background: rgba(0,220,130,0.2); border-color: #2effa0; }
    .call-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
      border-radius: 38px; display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 200; padding: 40px; gap: 20px;
    }
    .call-overlay.active { display: flex; }
    .call-avatar-big {
      width: 120px; height: 120px; border-radius: 50%;
      background: linear-gradient(145deg,#1e2a2e,#0f171c);
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(0,255,150,0.2);
      color: #a0f0c0; font-weight: 600; font-size: 48px;
    }
    .call-name { color: #eef5f0; font-size: 24px; font-weight: 600; }
    .call-status { color: #76c9a0; font-size: 14px; opacity: 0.7; }
    .call-actions { display: flex; gap: 30px; margin-top: 20px; }
    .call-btn {
      width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 28px;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center;
    }
    .call-btn:hover { transform: scale(1.05); }
    .call-btn:active { transform: scale(0.95); }
    .call-btn.end-call { background: rgba(255,80,80,0.2); border: 2px solid rgba(255,80,80,0.3); color: #ff6b6b; }
    .call-btn.end-call:hover { background: rgba(255,80,80,0.3); }
    .call-btn.answer-call { background: rgba(0,220,130,0.2); border: 2px solid rgba(0,255,150,0.3); color: #27e07b; }
    .call-btn.answer-call:hover { background: rgba(0,220,130,0.3); }
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
      border-radius: 38px; display: none; align-items: center; justify-content: center;
      z-index: 100; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: rgba(18,24,30,0.85); backdrop-filter: blur(20px);
      border-radius: 32px; padding: 28px 24px; width: 100%; max-width: 340px;
      border: 1px solid rgba(0,255,150,0.15); color: #d4e8dd;
    }
    .modal-card h3 { font-size: 20px; font-weight: 600; margin-bottom: 16px; color: #e4f5ec; text-align: center; }
    .modal-card input {
      width: 100%; padding: 12px 16px; margin-bottom: 12px;
      background: rgba(10,16,20,0.5); border: 1px solid rgba(0,255,150,0.12);
      border-radius: 30px; color: #d4e8dd; font-size: 14px; outline: none;
    }
    .modal-card input:focus { border-color: #27e07b; }
    .modal-actions { display: flex; gap: 10px; margin-top: 6px; justify-content: center; flex-wrap: wrap; }
    .modal-actions button {
      flex: 1; min-width: 70px; padding: 10px 0;
      background: rgba(0,220,130,0.1); border: 1px solid rgba(0,255,150,0.15);
      border-radius: 40px; color: #b3f0d0; font-weight: 600; font-size: 14px;
      cursor: pointer; transition: 0.15s;
    }
    .modal-actions button:hover { background: rgba(0,220,130,0.2); border-color: #2effa0; }
    .modal-actions button.danger { color: #ff8a8a; border-color: rgba(255,80,80,0.15); }
    .modal-actions button.danger:hover { background: rgba(255,80,80,0.1); }
    .modal-status { text-align: center; font-size: 12px; margin-top: 10px; color: #76c9a0; min-height: 18px; }
    @media (max-width: 460px) {
      .glass-wrapper { height: 94vh; border-radius: 28px; padding: 12px 10px; }
      .contacts-panel { width: 80px; padding: 8px 4px; }
      .contact-avatar-panel { width: 36px; height: 36px; font-size: 14px; }
      .contact-name-panel { font-size: 8px; max-width: 60px; }
      .add-contact-btn-panel { width: 36px; height: 36px; font-size: 18px; }
      .call-avatar-big { width: 80px; height: 80px; font-size: 32px; }
      .call-name { font-size: 18px; }
      .call-btn { width: 50px; height: 50px; font-size: 22px; }
    }
  </style>
</head>
<body>

<div class="glass-wrapper" id="app">
  <div class="app-container">
    <div class="contacts-panel" id="contactsPanel">
      <div class="panel-title">📋 Контакты</div>
      <div id="contactsListPanel"></div>
      <div class="add-contact-btn-panel" id="addContactPanelBtn">+</div>
    </div>
    <div class="chat-area">
      <div class="chat-header">
        <div class="chat-avatar" id="chatAvatar">💧</div>
        <div class="chat-info">
          <h2 id="chatTitle">Общий чат</h2>
          <span><span class="online-dot"></span> <span id="userStatus">не авторизован</span></span>
        </div>
        <div class="header-actions">
          <button class="header-btn call-btn" id="callBtn">📞</button>
          <button class="header-btn" id="authToggle">🔑 Вход</button>
        </div>
      </div>
      <div class="messages-area" id="messagesContainer"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="Сообщение ...">
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>

  <div class="call-overlay" id="callOverlay">
    <div class="call-avatar-big" id="callAvatar">💧</div>
    <div class="call-name" id="callName">Звонок</div>
    <div class="call-status" id="callStatus">Соединение...</div>
    <div class="call-actions">
      <button class="call-btn end-call" id="endCallBtn">📞</button>
      <button class="call-btn answer-call" id="answerCallBtn" style="display:none;">📞</button>
    </div>
  </div>

  <div class="modal-overlay" id="authModal">
    <div class="modal-card">
      <h3 id="authModalTitle">🔐 Вход</h3>
      <input type="email" id="authEmail" placeholder="Email">
      <input type="password" id="authPassword" placeholder="Пароль">
      <div class="modal-actions">
        <button id="authActionBtn">Войти</button>
        <button id="authSwitchBtn" class="danger">Регистрация</button>
        <button id="authCloseBtn">✕</button>
      </div>
      <div class="modal-status" id="authStatus">Введите данные</div>
    </div>
  </div>

  <div class="modal-overlay" id="contactModal">
    <div class="modal-card">
      <h3>📇 Добавить контакт</h3>
      <input type="email" id="contactEmailInput" placeholder="Email контакта">
      <div class="modal-actions">
        <button id="addContactBtn">➕ Добавить</button>
        <button id="contactCloseBtn">✕</button>
      </div>
      <div class="modal-status" id="contactStatus">Введите email</div>
    </div>
  </div>
</div>

<script>
  (function() {
    const firebaseConfig = {
      apiKey: "AIzaSyBIgCjEVT5BsPbGZqEARSDGvYv_9LclFY8",
      authDomain: "apoapsis-a9024.firebaseapp.com",
      databaseURL: "https://apoapsis-a9024-default-rtdb.firebaseio.com",
      projectId: "apoapsis-a9024",
      storageBucket: "apoapsis-a9024.firebasestorage.app",
      messagingSenderId: "264187106751",
      appId: "1:264187106751:web:712670b22bbaeeb7bcfd0a"
    };

    if (typeof firebase === 'undefined') { alert('Firebase SDK не загружен.'); return; }
    let app;
    try { app = firebase.initializeApp(firebaseConfig); } catch(e) { app = firebase.app(); }
    const auth = firebase.auth();
    const database = firebase.database();

    // DOM
    const messagesContainer = document.getElementById('messagesContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const authToggle = document.getElementById('authToggle');
    const authModal = document.getElementById('authModal');
    const contactModal = document.getElementById('contactModal');
    const userStatus = document.getElementById('userStatus');
    const chatTitle = document.getElementById('chatTitle');
    const chatAvatar = document.getElementById('chatAvatar');
    const contactsListPanel = document.getElementById('contactsListPanel');
    const addContactPanelBtn = document.getElementById('addContactPanelBtn');
    const callBtn = document.getElementById('callBtn');
    const callOverlay = document.getElementById('callOverlay');
    const callAvatar = document.getElementById('callAvatar');
    const callName = document.getElementById('callName');
    const callStatus = document.getElementById('callStatus');
    const endCallBtn = document.getElementById('endCallBtn');
    const answerCallBtn = document.getElementById('answerCallBtn');

    // State
    let currentUser = null;
    let isSignUpMode = false;
    let myContacts = new Set();
    let contactsListener = null;
    let messagesListener = null;
    let isProcessingContact = false;
    let selectedContact = null;
    let isInCall = false;
    let isCalling = false;
    let peerConnection = null;
    let localStream = null;
    let remoteStream = null;
    let callRef = null;
    let currentCallId = null;
    let audioElement = null;
    let isEnding = false;
    let callTimeout = null;
    let signalListener = null;
    let callListener = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function encodeEmailToKey(email) { return email.replace(/\./g, '_').replace(/#/g, '_').replace(/\$/g, '_').replace(/\[/g, '_').replace(/\]/g, '_'); }
    function decodeKeyToEmail(key) { return key.replace(/_/g, '.'); }
    function getTime() { return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); }
    function getAvatarLetter(email) { return email ? email.charAt(0).toUpperCase() : '?'; }
    function getContactDisplayName(email) { return email ? email.split('@')[0] : 'User'; }

    function createAudioElement() {
      if (audioElement) return audioElement;
      audioElement = document.createElement('audio');
      audioElement.autoplay = true;
      audioElement.volume = 1.0;
      audioElement.style.display = 'none';
      document.body.appendChild(audioElement);
      return audioElement;
    }

    function addCallMessage(type, contact) {
      try {
        const msg = {
          text: type === 'incoming' ? '📞 Входящий звонок' : 
                type === 'missed' ? '📞 Пропущенный звонок' :
                type === 'ended' ? '📞 Звонок завершен' : '📞 Звонок',
          timestamp: getTime(),
          sender: type === 'incoming' ? 'other' : 'me',
          senderEmail: type === 'incoming' ? contact : currentUser?.email || 'user',
          isCall: true,
          callType: type,
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };
        if (selectedContact && type !== 'incoming') {
          msg.recipient = selectedContact;
          msg.isPrivate = true;
        }
        database.ref('messages').push(msg).catch(err => console.error('Add message error:', err));
      } catch(e) {
        console.error('addCallMessage error:', e);
      }
    }

    function startCall() {
      if (!selectedContact) { alert('Выберите контакт'); return; }
      if (isInCall) return;
      if (!currentUser) { alert('Войдите в аккаунт'); return; }
      
      createAudioElement();
      isCalling = true;
      isInCall = true;
      isEnding = false;
      callOverlay.classList.add('active');
      callAvatar.textContent = getAvatarLetter(selectedContact);
      callName.textContent = getContactDisplayName(selectedContact);
      callStatus.textContent = 'Вызов...';
      answerCallBtn.style.display = 'none';
      endCallBtn.style.display = 'flex';

      const callId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
      currentCallId = callId;
      callRef = database.ref('calls/' + callId);
      callRef.set({
        from: currentUser.email,
        to: selectedContact,
        status: 'calling',
        timestamp: Date.now()
      }).catch(err => console.error('Call set error:', err));

      addCallMessage('outgoing', selectedContact);

      callListener = callRef.on('value', (snapshot) => {
        try {
          if (!snapshot) return;
          const data = snapshot.val();
          if (data && !isEnding) {
            if (data.status === 'answered') {
              callStatus.textContent = 'В разговоре...';
              setupPeerConnection(true, callId);
            } else if (data.status === 'ended' && !isEnding) {
              endCall();
            }
          }
        } catch(e) {
          console.error('Call listener error:', e);
        }
      });

      callTimeout = setTimeout(() => {
        if (isCalling && isInCall && !isEnding) {
          callStatus.textContent = 'Нет ответа';
          setTimeout(() => { if (isInCall && !isEnding) endCall(); }, 2000);
        }
      }, 30000);
    }

    function answerCall() {
      createAudioElement();
      isEnding = false;
      answerCallBtn.style.display = 'none';
      endCallBtn.style.display = 'flex';
      callStatus.textContent = 'В разговоре...';
      if (callRef) {
        callRef.update({ status: 'answered' }).catch(err => console.error('Update answer error:', err));
      }
      setupPeerConnection(false, currentCallId);
    }

    function setupPeerConnection(isCaller, callId) {
      try {
        if (peerConnection) {
          peerConnection.close();
          peerConnection = null;
        }

        const audioEl = createAudioElement();
        peerConnection = new RTCPeerConnection(rtcConfig);

        // Получаем микрофон
        navigator.mediaDevices.getUserMedia({ 
          audio: { 
            echoCancellation: true, 
            noiseSuppression: true,
            autoGainControl: true 
          }, 
          video: false 
        })
        .then(stream => {
          localStream = stream;
          if (peerConnection) {
            stream.getTracks().forEach(track => {
              peerConnection.addTrack(track, stream);
            });
          }
          console.log('✅ Микрофон активен');
        })
        .catch(err => {
          console.error('❌ Ошибка микрофона:', err);
          callStatus.textContent = '⚠️ Без микрофона';
        });

        // Входящий аудио поток
        peerConnection.ontrack = (event) => {
          console.log('📡 Получен аудио трек!');
          if (event.streams && event.streams.length > 0) {
            remoteStream = event.streams[0];
            if (audioEl) {
              audioEl.srcObject = remoteStream;
              audioEl.play()
                .then(() => {
                  console.log('🔊 Аудио воспроизводится!');
                  callStatus.textContent = 'В разговоре... 🔊';
                })
                .catch(err => {
                  console.error('❌ Ошибка воспроизведения:', err);
                  setTimeout(() => {
                    if (audioEl) {
                      audioEl.play().catch(e => console.error('Retry play error:', e));
                    }
                  }, 500);
                });
            }
          }
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate && callRef && !isEnding) {
            console.log('📤 ICE кандидат');
            callRef.update({ candidate: event.candidate }).catch(err => console.error('ICE update error:', err));
          }
        };

        peerConnection.onconnectionstatechange = () => {
          console.log('🔄 Состояние:', peerConnection.connectionState);
          if (!isEnding) {
            if (peerConnection.connectionState === 'connected') {
              callStatus.textContent = 'В разговоре... 🔊';
            } else if (peerConnection.connectionState === 'disconnected' || 
                       peerConnection.connectionState === 'failed') {
              endCall();
            }
          }
        };

        const callRefObj = database.ref('calls/' + callId);
        
        if (isCaller) {
          peerConnection.createOffer()
            .then(offer => {
              console.log('📤 Offer создан');
              return peerConnection.setLocalDescription(offer);
            })
            .then(() => {
              if (callRef && !isEnding) {
                callRefObj.update({ offer: peerConnection.localDescription }).catch(err => console.error('Offer update error:', err));
              }
            })
            .catch(err => console.error('Offer error:', err));
        }

        signalListener = callRefObj.on('child_changed', (snapshot) => {
          try {
            if (!snapshot) return;
            const data = snapshot.val();
            if (!peerConnection || isEnding) return;

            if (data && data.offer && !isCaller) {
              console.log('📥 Получен offer');
              peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer))
                .then(() => peerConnection.createAnswer())
                .then(answer => peerConnection.setLocalDescription(answer))
                .then(() => {
                  if (callRef && !isEnding) {
                    callRefObj.update({ answer: peerConnection.localDescription }).catch(err => console.error('Answer update error:', err));
                  }
                })
                .catch(err => console.error('Answer error:', err));
            }
            
            if (data && data.answer && isCaller) {
              console.log('📥 Получен answer');
              peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer))
                .catch(err => console.error('Set remote desc error:', err));
            }

            if (data && data.candidate) {
              console.log('📥 Получен ICE кандидат');
              peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate))
                .catch(err => console.error('Add ICE error:', err));
            }
          } catch(e) {
            console.error('Signal listener error:', e);
          }
        });

      } catch(e) {
        console.error('setupPeerConnection error:', e);
      }
    }

    function endCall() {
      if (isEnding) return;
      isEnding = true;
      console.log('📞 Завершение звонка');
      
      if (callTimeout) {
        clearTimeout(callTimeout);
        callTimeout = null;
      }
      
      isInCall = false;
      isCalling = false;
      
      callOverlay.classList.remove('active');
      answerCallBtn.style.display = 'none';
      endCallBtn.style.display = 'flex';
      
      if (peerConnection) {
        try { peerConnection.close(); } catch(e) {}
        peerConnection = null;
      }
      
      if (localStream) {
        try { localStream.getTracks().forEach(track => track.stop()); } catch(e) {}
        localStream = null;
      }
      
      if (remoteStream) {
        try { remoteStream.getTracks().forEach(track => track.stop()); } catch(e) {}
        remoteStream = null;
      }
      
      if (audioElement) {
        try {
          audioElement.srcObject = null;
          audioElement.pause();
        } catch(e) {}
      }
      
      if (callRef) {
        try {
          callRef.update({ status: 'ended' });
          setTimeout(() => { try { callRef.remove(); } catch(e) {} }, 500);
        } catch(e) {}
        callRef = null;
      }
      
      if (callListener) {
        try { callListener(); } catch(e) {}
        callListener = null;
      }
      
      if (signalListener) {
        try {
          if (currentCallId) {
            database.ref('calls/' + currentCallId).off('child_changed', signalListener);
          }
        } catch(e) {}
        signalListener = null;
      }
      
      if (selectedContact) {
        try { addCallMessage('ended', selectedContact); } catch(e) {}
      }
      
      currentCallId = null;
      isEnding = false;
    }

    // --- ОСТАЛЬНОЙ КОД ---
    function renderMessage(data, key) {
      const { text, timestamp, sender, senderEmail, recipient, isCall, callType } = data;
      if (!text) return null;
      const isOwn = sender === 'me' && senderEmail === currentUser?.email;
      
      if (selectedContact) {
        if (!isOwn && senderEmail !== selectedContact) return null;
        if (isOwn && recipient && recipient !== selectedContact) return null;
        if (!isOwn && senderEmail && senderEmail !== selectedContact) return null;
        if (isOwn && !recipient && !isCall) return null;
      } else {
        if (recipient) return null;
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper';
      wrapper.classList.add(isOwn ? 'own' : 'other');

      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'msg-avatar';
      avatarDiv.textContent = isOwn ? 'Я' : getAvatarLetter(senderEmail || '');
      wrapper.appendChild(avatarDiv);

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';

      if (!isCall) {
        const nameSpan = document.createElement('span');
        nameSpan.className = 'msg-sender-name';
        nameSpan.textContent = isOwn ? 'Вы' : getContactDisplayName(senderEmail || '');
        contentDiv.appendChild(nameSpan);
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message';
      
      if (isCall) {
        const callDiv = document.createElement('div');
        callDiv.style.cssText = 'display:flex;align-items:center;gap:6px;color:#76c9a0;font-size:13px;';
        const icon = document.createElement('span');
        icon.textContent = '📞';
        callDiv.appendChild(icon);
        const textSpan = document.createElement('span');
        textSpan.textContent = callType === 'incoming' ? 'Входящий звонок' :
                              callType === 'missed' ? 'Пропущенный звонок' :
                              callType === 'ended' ? 'Звонок завершен' : 'Звонок';
        callDiv.appendChild(textSpan);
        msgDiv.appendChild(callDiv);
      } else {
        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        msgDiv.appendChild(textSpan);
      }

      const timeSpan = document.createElement('span');
      timeSpan.className = 'msg-time';
      timeSpan.textContent = timestamp || getTime();
      msgDiv.appendChild(timeSpan);
      
      contentDiv.appendChild(msgDiv);
      wrapper.appendChild(contentDiv);
      if (key) wrapper.dataset.key = key;
      return wrapper;
    }

    function loadMessages() {
      if (messagesListener) {
        try { database.ref('messages').off('child_added', messagesListener); } catch(e) {}
        messagesListener = null;
      }
      messagesContainer.innerHTML = '';
      const messagesRef = database.ref('messages');
      messagesListener = messagesRef.orderByChild('createdAt').limitToLast(100).on('child_added', function(snapshot) {
        try {
          if (!snapshot) return;
          const data = snapshot.val();
          if (!data || !data.text) return;
          const key = snapshot.key;
          if (messagesContainer.querySelector(`[data-key="${key}"]`)) return;
          const el = renderMessage(data, key);
          if (el) {
            messagesContainer.appendChild(el);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
          }
        } catch(e) {
          console.error('Load messages error:', e);
        }
      });
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) {
        messageInput.style.border = '1px solid #ff5e7a';
        setTimeout(() => messageInput.style.border = 'none', 400);
        return;
      }
      if (!currentUser) { alert('Войдите в аккаунт.'); return; }
      const msg = {
        text: text, timestamp: getTime(), sender: 'me',
        senderEmail: currentUser.email || 'user',
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };
      if (selectedContact) { msg.recipient = selectedContact; msg.isPrivate = true; }
      database.ref('messages').push(msg)
        .then(() => { messageInput.value = ''; messageInput.focus(); })
        .catch(err => { console.error(err); alert('Ошибка отправки.'); });
    }

    function selectContact(email) {
      selectedContact = email;
      chatTitle.textContent = getContactDisplayName(email);
      chatAvatar.textContent = getAvatarLetter(email);
      userStatus.textContent = 'Чат с ' + getContactDisplayName(email);
      callBtn.style.display = 'flex';
      renderContactsPanel();
      loadMessages();
    }

    function selectGeneralChat() {
      selectedContact = null;
      chatTitle.textContent = 'Общий чат';
      chatAvatar.textContent = '💧';
      userStatus.textContent = currentUser?.email + ' ✅';
      callBtn.style.display = 'none';
      renderContactsPanel();
      loadMessages();
    }

    function addContactToOtherUser(email, currentUserEmail) {
      try {
        const usersRef = database.ref('users');
        usersRef.once('value', (snapshot) => {
          try {
            if (!snapshot) return;
            const users = snapshot.val();
            if (users) {
              let targetUid = null;
              for (const [uid, userData] of Object.entries(users)) {
                if (userData.email === email) { targetUid = uid; break; }
              }
              if (targetUid) {
                const safeKey = encodeEmailToKey(currentUserEmail);
                database.ref('users/' + targetUid + '/contacts/' + safeKey).set(true);
              }
            }
          } catch(e) {}
        });
      } catch(e) {}
    }

    function addContact() {
      if (isProcessingContact) return;
      const email = contactEmailInput.value.trim();
      if (!email || !email.includes('@')) { contactStatus.textContent = '❌ Введите корректный email'; return; }
      if (!currentUser) { contactStatus.textContent = '❌ Сначала войдите'; return; }
      if (myContacts.has(email)) { contactStatus.textContent = '⚠️ Контакт уже есть'; return; }
      if (email === currentUser.email) { contactStatus.textContent = '❌ Нельзя добавить себя'; return; }

      isProcessingContact = true;
      contactStatus.textContent = '⏳ Добавление...';
      
      const safeKey = encodeEmailToKey(email);
      const userContactsRef = database.ref('users/' + currentUser.uid + '/contacts/' + safeKey);
      
      userContactsRef.set(true)
        .then(() => {
          addContactToOtherUser(email, currentUser.email);
          contactStatus.textContent = '✅ Контакт добавлен!';
          contactEmailInput.value = '';
          if (!myContacts.has(email)) myContacts.add(email);
          renderContactsPanel();
          setTimeout(() => {
            isProcessingContact = false;
            contactStatus.textContent = 'Введите email';
            contactModal.classList.remove('active');
          }, 800);
        })
        .catch(err => {
          console.error(err);
          contactStatus.textContent = '❌ Ошибка: ' + err.message;
          isProcessingContact = false;
        });
    }

    function renderContactsPanel() {
      try {
        if (!currentUser) {
          contactsListPanel.innerHTML = '<div style="text-align:center;color:#3a5a4a;font-size:10px;padding:10px 0;">Войдите</div>';
          return;
        }
        if (myContacts.size === 0) {
          contactsListPanel.innerHTML = '<div style="text-align:center;color:#3a5a4a;font-size:10px;padding:10px 0;">Нет контактов</div>';
          return;
        }

        let html = '';
        const isGeneral = !selectedContact;
        html += `<div class="contact-item-panel ${isGeneral ? 'active' : ''}" data-contact="general">
          <div class="contact-avatar-panel">💧</div><div class="contact-name-panel">Общий</div></div>`;

        const sortedContacts = Array.from(myContacts).sort();
        sortedContacts.forEach(email => {
          const isActive = selectedContact === email;
          html += `<div class="contact-item-panel ${isActive ? 'active' : ''}" data-contact="${email}">
            <div class="contact-avatar-panel">${getAvatarLetter(email)}</div>
            <div class="contact-name-panel">${getContactDisplayName(email)}</div>
            <div class="contact-call-btn" data-email="${email}">📞</div>
          </div>`;
        });
        contactsListPanel.innerHTML = html;

        document.querySelectorAll('.contact-item-panel').forEach(el => {
          el.addEventListener('click', function(e) {
            if (e.target.closest('.contact-call-btn')) return;
            const contact = this.dataset.contact;
            if (contact === 'general') selectGeneralChat();
            else selectContact(contact);
          });
        });

        document.querySelectorAll('.contact-call-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const email = this.dataset.email;
            selectedContact = email;
            selectContact(email);
            startCall();
          });
        });
      } catch(e) {
        console.error('renderContactsPanel error:', e);
      }
    }

    function loadContacts() {
      if (!currentUser) return;
      if (contactsListener) {
        try { database.ref('users/' + currentUser.uid + '/contacts').off('value', contactsListener); } catch(e) {}
        contactsListener = null;
      }
      const userContactsRef = database.ref('users/' + currentUser.uid + '/contacts');
      contactsListener = userContactsRef.on('value', (snapshot) => {
        try {
          if (!snapshot) return;
          const data = snapshot.val();
          myContacts.clear();
          if (data) {
            Object.keys(data).forEach(key => {
              if (data[key] === true) {
                const email = decodeKeyToEmail(key);
                myContacts.add(email);
              }
            });
          }
          renderContactsPanel();
          setTimeout(() => { isProcessingContact = false; }, 100);
        } catch(e) {
          console.error('Contacts listener error:', e);
        }
      });
    }

    function handleAuthAction() {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) { authStatus.textContent = '❌ Заполните все поля'; return; }
      authStatus.textContent = '⏳ Обработка...';
      if (isSignUpMode) {
        auth.createUserWithEmailAndPassword(email, password)
          .then((userCred) => {
            database.ref('users/' + userCred.user.uid + '/email').set(email);
            authStatus.textContent = '✅ Регистрация успешна!';
            updateUserUI(userCred.user);
          })
          .catch((err) => { authStatus.textContent = '❌ ' + err.message; });
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .then((userCred) => {
            authStatus.textContent = '✅ Вход выполнен!';
            updateUserUI(userCred.user);
          })
          .catch((err) => { authStatus.textContent = '❌ ' + err.message; });
      }
    }

    function updateUserUI(user) {
      try {
        if (user) {
          currentUser = user;
          userStatus.textContent = user.email + ' ✅';
          authToggle.textContent = '🚪 Выйти';
          selectedContact = null;
          chatTitle.textContent = 'Общий чат';
          chatAvatar.textContent = '💧';
          callBtn.style.display = 'none';
          loadContacts();
          loadMessages();
          authModal.classList.remove('active');
        } else {
          currentUser = null;
          userStatus.textContent = 'не авторизован';
          chatTitle.textContent = 'Общий чат';
          chatAvatar.textContent = '💧';
          authToggle.textContent = '🔑 Вход';
          callBtn.style.display = 'none';
          messagesContainer.innerHTML = '<div style="text-align:center;color:#3a5a4a;padding:30px;">Войдите чтобы видеть сообщения</div>';
          myContacts.clear();
          renderContactsPanel();
          if (messagesListener) {
            try { database.ref('messages').off('child_added', messagesListener); } catch(e) {}
            messagesListener = null;
          }
          if (contactsListener) {
            try { database.ref('users/' + (currentUser?.uid || '') + '/contacts').off('value', contactsListener); } catch(e) {}
            contactsListener = null;
          }
        }
      } catch(e) {
        console.error('updateUserUI error:', e);
      }
    }

    function logout() {
      if (isInCall) endCall();
      auth.signOut().then(() => {
        updateUserUI(null);
        authModal.classList.remove('active');
        contactModal.classList.remove('active');
        isProcessingContact = false;
      }).catch(err => console.error(err));
    }

    // --- ИНИЦИАЛИЗАЦИЯ ---
    auth.onAuthStateChanged(user => { if (user) updateUserUI(user); else updateUserUI(null); });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });

    authToggle.addEventListener('click', () => {
      if (currentUser) { logout(); return; }
      authModal.classList.add('active');
      authEmail.value = '';
      authPassword.value = '';
      authStatus.textContent = 'Введите данные';
      isSignUpMode = false;
      authModalTitle.textContent = '🔐 Вход';
      authActionBtn.textContent = 'Войти';
      authSwitchBtn.textContent = 'Регистрация';
    });

    authCloseBtn.addEventListener('click', () => { authModal.classList.remove('active'); });
    authSwitchBtn.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      if (isSignUpMode) {
        authModalTitle.textContent = '📝 Регистрация';
        authActionBtn.textContent = 'Создать';
        authSwitchBtn.textContent = '← Вход';
      } else {
        authModalTitle.textContent = '🔐 Вход';
        authActionBtn.textContent = 'Войти';
        authSwitchBtn.textContent = 'Регистрация';
      }
      authStatus.textContent = isSignUpMode ? 'Создайте аккаунт' : 'Введите данные';
    });

    authActionBtn.addEventListener('click', handleAuthAction);
    authPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuthAction(); });
    authEmail.addEventListener('keydown', (e) => { if (e.key === 'Enter') authPassword.focus(); });

    callBtn.addEventListener('click', () => {
      if (selectedContact) startCall();
      else alert('Выберите контакт для звонка');
    });

    endCallBtn.addEventListener('click', endCall);
    answerCallBtn.addEventListener('click', answerCall);

    addContactPanelBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!currentUser) { alert('Войдите в аккаунт'); return; }
      contactModal.classList.add('active');
      contactEmailInput.value = '';
      contactStatus.textContent = 'Введите email контакта';
      contactEmailInput.focus();
    });

    contactCloseBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      contactModal.classList.remove('active');
      isProcessingContact = false;
    });

    addContactBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      addContact();
    });

    contactEmailInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); addContact(); }
    });

    authModal.addEventListener('click', (e) => { if (e.target === authModal) authModal.classList.remove('active'); });
    contactModal.addEventListener('click', (e) => { if (e.target === contactModal) contactModal.classList.remove('active'); });

    function listenForCalls() {
      if (!currentUser) return;
      const callsRef = database.ref('calls');
      callsRef.orderByChild('to').equalTo(currentUser.email).on('child_added', (snapshot) => {
        try {
          if (!snapshot) return;
          const data = snapshot.val();
          if (data && data.status === 'calling' && !isInCall) {
            currentCallId = snapshot.key;
            callRef = database.ref('calls/' + currentCallId);
            
            callOverlay.classList.add('active');
            callAvatar.textContent = getAvatarLetter(data.from);
            callName.textContent = getContactDisplayName(data.from);
            callStatus.textContent = 'Входящий звонок... 📞';
            endCallBtn.style.display = 'none';
            answerCallBtn.style.display = 'flex';
            
            selectedContact = data.from;
            addCallMessage('incoming', data.from);
            
            setTimeout(() => {
              if (isInCall === false && callOverlay.classList.contains('active') && !isEnding) {
                endCall();
                addCallMessage('missed', data.from);
              }
            }, 20000);
          }
        } catch(e) {
          console.error('Listen calls error:', e);
        }
      });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        setTimeout(() => listenForCalls(), 500);
      }
    });

    function seedDemoIfEmpty() {
      if (!currentUser) return;
      const messagesRef = database.ref('messages');
      messagesRef.limitToFirst(1).once('value', (snapshot) => {
        try {
          if (!snapshot || snapshot.exists()) return;
          const demo = [
            { text: 'Добро пожаловать в Liquid Messenger ✨', sender: 'other', timestamp: getTime(), senderEmail: 'demo@liquid.chat' },
            { text: 'Добавляйте контакты и звоните! 📞', sender: 'other', timestamp: getTime(), senderEmail: 'demo@liquid.chat' },
          ];
          demo.forEach((msg) => {
            messagesRef.push({
              text: msg.text, timestamp: msg.timestamp,
              sender: msg.sender, senderEmail: msg.senderEmail,
              createdAt: Date.now()
            });
          });
        } catch(e) {
          console.error('seedDemoIfEmpty error:', e);
        }
      });
    }

    auth.onAuthStateChanged(user => {
      if (user) { setTimeout(() => seedDemoIfEmpty(), 500); }
    });

    console.log('✅ Liquid Messenger - WebRTC с Firebase');
    console.log('📞 Для звонка выберите контакт и нажмите 📞');
    console.log('🔊 Убедитесь что разрешили доступ к микрофону');
  })();
</script>

</body>
</html>
