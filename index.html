<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>APOAPSIS · личные чаты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js"
      }
    }
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f0f;
      font-family: 'Dela Gothic One', cursive, sans-serif;
      padding: 12px;
      margin: 0;
    }

    .messenger {
      max-width: 480px;
      width: 100%;
      background: #1a1a1a;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.03);
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 700px;
      max-height: 95vh;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 10px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      flex-shrink: 0;
      background: #1a1a1a;
      z-index: 2;
      flex-wrap: wrap;
      gap: 6px;
    }

    .logo {
      font-family: 'Dela Gothic One', cursive;
      font-size: 1.4rem;
      letter-spacing: 2px;
      color: #e8ffe8;
      background: rgba(40, 160, 40, 0.04);
      padding: 0 12px 0 8px;
      border-radius: 40px;
      border: 1px solid rgba(80, 220, 80, 0.03);
      line-height: 1.4;
      display: inline-block;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.6rem;
      background: rgba(255, 255, 255, 0.02);
      color: #6a8f6a;
      padding: 4px 12px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .new-chat-btn {
      background: rgba(40, 160, 40, 0.04);
      border: 1px solid rgba(80, 220, 80, 0.04);
      border-radius: 40px;
      padding: 6px 14px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.6rem;
      color: #8ab88a;
      cursor: pointer;
      transition: 0.15s;
      white-space: nowrap;
    }
    .new-chat-btn:hover {
      background: rgba(40, 200, 40, 0.04);
      border-color: rgba(80, 220, 80, 0.06);
      color: #a8d8a8;
    }

    /* ===== АВТОРИЗАЦИЯ ===== */
    .auth-area {
      padding: 10px 16px 10px 16px;
      background: #141414;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      flex-shrink: 0;
    }

    .auth-area .auth-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .auth-area input {
      flex: 1;
      min-width: 80px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 40px;
      padding: 8px 14px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.7rem;
      color: #d4e8d4;
      outline: none;
      transition: 0.2s;
    }
    .auth-area input:focus {
      border-color: rgba(80, 220, 80, 0.06);
      background: rgba(255, 255, 255, 0.01);
    }
    .auth-area input::placeholder {
      color: rgba(200, 255, 200, 0.06);
    }

    .auth-btn {
      background: rgba(40, 160, 40, 0.03);
      border: 1px solid rgba(80, 220, 80, 0.03);
      border-radius: 40px;
      padding: 8px 16px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.65rem;
      color: #8ab88a;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .auth-btn:hover {
      background: rgba(40, 200, 40, 0.03);
      border-color: rgba(80, 220, 80, 0.05);
      color: #a8d8a8;
    }
    .auth-btn:active {
      transform: scale(0.95);
    }

    .auth-status {
      font-size: 0.55rem;
      color: rgba(200, 255, 200, 0.12);
      text-align: center;
      letter-spacing: 0.5px;
      padding-top: 6px;
    }
    .auth-status.error {
      color: rgba(255, 150, 150, 0.25);
    }
    .auth-status.success {
      color: rgba(150, 255, 150, 0.15);
    }

    /* ===== ИНФО О ЧАТЕ ===== */
    .chat-info {
      padding: 8px 16px 6px 16px;
      background: #141414;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      font-size: 0.6rem;
      color: rgba(200, 255, 200, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .chat-info .chat-partner {
      color: #8fc98f;
      font-size: 0.7rem;
    }
    .chat-info .close-chat {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 40px;
      padding: 2px 12px;
      color: rgba(200, 200, 200, 0.15);
      cursor: pointer;
      font-size: 0.5rem;
      font-family: 'Dela Gothic One', cursive;
    }
    .chat-info .close-chat:hover {
      color: rgba(200, 200, 200, 0.3);
    }

    /* ===== ОКНО СООБЩЕНИЙ ===== */
    .messages-window {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      scroll-behavior: smooth;
      background: #141414;
    }

    .messages-window::-webkit-scrollbar {
      width: 4px;
    }
    .messages-window::-webkit-scrollbar-track {
      background: transparent;
    }
    .messages-window::-webkit-scrollbar-thumb {
      background: rgba(80, 220, 80, 0.04);
      border-radius: 20px;
    }

    /* ===== СООБЩЕНИЯ ===== */
    .message-item {
      font-family: 'Dela Gothic One', cursive;
      background: rgba(255, 255, 255, 0.02);
      padding: 7px 12px;
      border-radius: 14px 14px 14px 4px;
      color: #d4e8d4;
      border-left: 2px solid rgba(80, 220, 80, 0.04);
      word-break: break-word;
      font-size: 0.85rem;
      line-height: 1.4;
      letter-spacing: 0.2px;
      animation: floatIn 0.2s ease-out;
      max-width: 92%;
      align-self: flex-start;
    }

    .message-item strong {
      color: #8fc98f;
      font-weight: 400;
      background: rgba(80, 220, 80, 0.02);
      padding: 0 8px 0 4px;
      border-radius: 20px;
      margin-right: 4px;
      font-size: 0.7rem;
      border: 1px solid rgba(80, 220, 80, 0.02);
    }

    .message-item.own {
      align-self: flex-end;
      border-left: none;
      border-right: 2px solid rgba(80, 220, 80, 0.06);
      border-radius: 14px 14px 4px 14px;
      background: rgba(40, 160, 40, 0.02);
    }

    .system-message {
      font-family: 'Dela Gothic One', cursive;
      text-align: center;
      color: rgba(180, 230, 180, 0.07);
      padding: 4px 10px;
      font-size: 0.55rem;
      letter-spacing: 1px;
      align-self: center;
      width: 100%;
    }

    @keyframes floatIn {
      0% { opacity: 0.2; transform: translateY(4px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== ПОЛЕ ВВОДА ===== */
    .input-area {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px 14px 12px 14px;
      background: #141414;
      border-top: 1px solid rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 40px;
      padding: 10px 16px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.85rem;
      color: #d4e8d4;
      outline: none;
      transition: 0.2s;
    }
    .input-area input:focus {
      border-color: rgba(80, 220, 80, 0.04);
      background: rgba(255, 255, 255, 0.01);
    }
    .input-area input::placeholder {
      color: rgba(200, 255, 200, 0.04);
      font-size: 0.75rem;
    }
    .input-area input:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .input-area button {
      background: rgba(40, 160, 40, 0.02);
      border: 1px solid rgba(80, 220, 80, 0.02);
      border-radius: 40px;
      padding: 10px 20px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.9rem;
      color: #8ab88a;
      cursor: pointer;
      transition: 0.1s;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .input-area button:hover {
      background: rgba(40, 200, 40, 0.02);
      border-color: rgba(80, 220, 80, 0.04);
      color: #a8d8a8;
    }
    .input-area button:active {
      transform: scale(0.94);
    }
    .input-area button:disabled {
      opacity: 0.15;
      cursor: not-allowed;
    }

    /* ===== МОДАЛ НОВОГО ЧАТА ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 28px 24px 24px 24px;
      max-width: 340px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }
    .modal h3 {
      color: #d4e8d4;
      font-size: 1rem;
      margin-bottom: 12px;
      letter-spacing: 1px;
      font-weight: 400;
    }
    .modal input {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 40px;
      padding: 12px 16px;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.8rem;
      color: #d4e8d4;
      outline: none;
      margin-bottom: 12px;
    }
    .modal input:focus {
      border-color: rgba(80, 220, 80, 0.06);
    }
    .modal input::placeholder {
      color: rgba(200, 255, 200, 0.06);
    }
    .modal .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .modal .modal-buttons button {
      padding: 10px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: rgba(255, 255, 255, 0.02);
      color: #8ab88a;
      font-family: 'Dela Gothic One', cursive;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.15s;
    }
    .modal .modal-buttons button:hover {
      background: rgba(40, 200, 40, 0.02);
      border-color: rgba(80, 220, 80, 0.04);
    }
    .modal .modal-buttons button.primary {
      background: rgba(40, 160, 40, 0.04);
      border-color: rgba(80, 220, 80, 0.04);
    }
    .modal .modal-buttons button.primary:hover {
      background: rgba(40, 200, 40, 0.04);
    }

    @media (max-width: 480px) {
      .messenger {
        border-radius: 20px;
        height: 100vh;
        max-height: 100vh;
      }
      .header {
        padding: 12px 12px 8px 12px;
      }
      .logo {
        font-size: 1.2rem;
      }
      .auth-area {
        padding: 8px 12px;
      }
      .auth-area input {
        font-size: 0.6rem;
        padding: 6px 10px;
      }
      .auth-btn {
        font-size: 0.55rem;
        padding: 6px 10px;
      }
      .messages-window {
        padding: 6px 10px;
      }
      .message-item {
        font-size: 0.75rem;
        padding: 5px 10px;
      }
      .input-area {
        padding: 6px 10px 10px 10px;
      }
      .input-area input {
        font-size: 0.75rem;
        padding: 8px 12px;
      }
      .input-area button {
        font-size: 0.75rem;
        padding: 8px 14px;
      }
      .modal {
        margin: 16px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="messenger">
    <!-- ШАПКА -->
    <div class="header">
      <span class="logo">APOAPSIS</span>
      <div class="header-right">
        <span class="status-badge" id="authBadge">✦ войдите</span>
        <button class="new-chat-btn" id="newChatBtn">+ новый чат</button>
      </div>
    </div>

    <!-- АВТОРИЗАЦИЯ -->
    <div class="auth-area" id="authArea">
      <div class="auth-row">
        <input type="email" id="authEmail" placeholder="почта" autocomplete="email" />
        <input type="password" id="authPassword" placeholder="пароль" autocomplete="current-password" />
      </div>
      <div class="auth-row" style="justify-content: center; margin-top: 4px;">
        <button class="auth-btn" id="authLoginBtn">вход</button>
        <button class="auth-btn" id="authRegisterBtn">регистрация</button>
        <button class="auth-btn" id="authLogoutBtn" style="display:none;">выход</button>
      </div>
      <div class="auth-status" id="authStatus">введите почту и пароль</div>
    </div>

    <!-- ИНФО О ЧАТЕ -->
    <div class="chat-info" id="chatInfo">
      <span class="chat-partner" id="chatPartner">общий чат</span>
      <button class="close-chat" id="closeChatBtn" style="display:none;">✕ закрыть</button>
    </div>

    <!-- СООБЩЕНИЯ -->
    <div id="messageContainer" class="messages-window">
      <div class="system-message">войдите, чтобы писать</div>
    </div>

    <!-- ВВОД -->
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="сообщение..." autocomplete="off" disabled />
      <button id="sendButton" disabled>➤</button>
    </div>
  </div>

  <!-- МОДАЛ НОВОГО ЧАТА -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>📨 новый личный чат</h3>
      <input type="email" id="modalEmail" placeholder="почта собеседника" />
      <div class="modal-buttons">
        <button id="modalCancel">отмена</button>
        <button class="primary" id="modalStart">начать чат</button>
      </div>
    </div>
  </div>

  <script type="module">
    // ========== FIREBASE ==========
    import { initializeApp } from 'firebase/app';
    import { getDatabase, ref, push, onChildAdded, query, orderByChild, equalTo, get, child } from 'firebase/database';
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from 'firebase/auth';

    const firebaseConfig = {
      apiKey: "AIzaSyBIgCjEVT5BsPbGZqEARSDGvYv_9LclFY8",
      authDomain: "apoapsis-a9024.firebaseapp.com",
      projectId: "apoapsis-a9024",
      storageBucket: "apoapsis-a9024.firebasestorage.app",
      messagingSenderId: "264187106751",
      appId: "1:264187106751:web:712670b22bbaeeb7bcfd0a"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth(app);

    // ========== DOM ==========
    const messageContainer = document.getElementById('messageContainer');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');
    const authEmail = document.getElementById('authEmail');
    const authPassword = document.getElementById('authPassword');
    const authStatus = document.getElementById('authStatus');
    const authBadge = document.getElementById('authBadge');
    const authLoginBtn = document.getElementById('authLoginBtn');
    const authRegisterBtn = document.getElementById('authRegisterBtn');
    const authLogoutBtn = document.getElementById('authLogoutBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalEmail = document.getElementById('modalEmail');
    const modalCancel = document.getElementById('modalCancel');
    const modalStart = document.getElementById('modalStart');
    const chatPartner = document.getElementById('chatPartner');
    const closeChatBtn = document.getElementById('closeChatBtn');

    let currentUser = null;
    let currentChatId = 'general'; // 'general' или 'private:user1:user2'
    let currentPartner = null;

    // ========== УТИЛИТЫ ==========
    function getChatId(user1, user2) {
      const sorted = [user1, user2].sort();
      return `private:${sorted[0]}:${sorted[1]}`;
    }

    // ========== СООБЩЕНИЯ ==========
    function addMessageToDOM(text, isOwn = false, isSystem = false) {
      const msgDiv = document.createElement('div');
      if (isSystem) {
        msgDiv.className = 'system-message';
        msgDiv.textContent = text;
      } else {
        msgDiv.className = 'message-item' + (isOwn ? ' own' : '');
        const names = ['🌱 Apo', '💧 Physis', '🌿 Eco', '🍃 Verd', '✨ Moss'];
        const name = names[Math.floor(Math.random() * names.length)];
        msgDiv.innerHTML = `<strong>${name}</strong> ${text}`;
      }
      messageContainer.appendChild(msgDiv);
      messageContainer.scrollTop = messageContainer.scrollHeight;
    }

    // ========== ПРИЁМ СООБЩЕНИЙ ==========
    let messagesListener = null;

    function listenMessages(chatId) {
      // Удаляем старый слушатель
      if (messagesListener) {
        messagesListener();
        messagesListener = null;
      }

      // Очищаем окно
      messageContainer.innerHTML = '';

      const chatRef = ref(database, `chats/${chatId}/messages`);

      // Добавляем системное сообщение
      if (chatId === 'general') {
        const sys = document.createElement('div');
        sys.className = 'system-message';
        sys.textContent = 'общий чат';
        messageContainer.appendChild(sys);
      } else if (currentPartner) {
        const sys = document.createElement('div');
        sys.className = 'system-message';
        sys.textContent = `личный чат с ${currentPartner}`;
        messageContainer.appendChild(sys);
      }

      // Слушаем новые сообщения
      messagesListener = onChildAdded(chatRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.text) {
          if (data.text.startsWith('🔥')) {
            addMessageToDOM(data.text, false, true);
          } else {
            const isOwn = data.uid === currentUser?.uid;
            addMessageToDOM(data.text, isOwn, false);
          }
        }
      });
    }

    // ========== ОТПРАВКА ==========
    function sendMessage() {
      if (!currentUser) {
        authStatus.textContent = '⚠️ войдите, чтобы писать';
        authStatus.className = 'auth-status error';
        return;
      }
      const rawText = messageInput.value.trim();
      if (rawText === '') return;

      const chatRef = ref(database, `chats/${currentChatId}/messages`);
      push(chatRef, { text: rawText, uid: currentUser.uid, email: currentUser.email })
        .then(() => {
          messageInput.value = '';
          messageInput.focus();
        })
        .catch((error) => {
          console.error(error);
          addMessageToDOM('⚠️ ошибка', false, true);
        });
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    });

    // ========== УСТАНОВКА ЧАТА ==========
    function setChat(chatId, partnerEmail = null) {
      currentChatId = chatId;
      currentPartner = partnerEmail;

      if (partnerEmail) {
        chatPartner.textContent = `💬 ${partnerEmail}`;
        closeChatBtn.style.display = 'inline-block';
      } else {
        chatPartner.textContent = '💬 общий чат';
        closeChatBtn.style.display = 'none';
      }

      // Обновляем плейсхолдер
      if (partnerEmail) {
        messageInput.placeholder = `сообщение для ${partnerEmail}...`;
      } else {
        messageInput.placeholder = 'сообщение...';
      }

      listenMessages(chatId);
    }

    // ========== ЗАКРЫТЬ ЛИЧНЫЙ ЧАТ ==========
    closeChatBtn.addEventListener('click', () => {
      setChat('general', null);
    });

    // ========== НОВЫЙ ЧАТ ==========
    newChatBtn.addEventListener('click', () => {
      if (!currentUser) {
        authStatus.textContent = '⚠️ сначала войдите';
        authStatus.className = 'auth-status error';
        return;
      }
      modalOverlay.classList.add('active');
      modalEmail.value = '';
      modalEmail.focus();
    });

    modalCancel.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) modalOverlay.classList.remove('active');
    });

    modalStart.addEventListener('click', () => {
      const email = modalEmail.value.trim();
      if (!email) {
        alert('введите почту собеседника');
        return;
      }
      if (email === currentUser.email) {
        alert('нельзя писать самому себе');
        return;
      }

      // Проверяем, существует ли пользователь
      // Для простоты просто создаём чат
      const chatId = getChatId(currentUser.email, email);
      setChat(chatId, email);
      modalOverlay.classList.remove('active');

      // Отправляем системное сообщение о создании чата
      const chatRef = ref(database, `chats/${chatId}/messages`);
      push(chatRef, {
        text: `🔥 чат создан между ${currentUser.email} и ${email}`,
        uid: 'system'
      }).catch(() => {});
    });

    // ========== АВТОРИЗАЦИЯ ==========
    function setAuthUI(user) {
      if (user) {
        currentUser = user;
        authBadge.textContent = `✦ ${user.email}`;
        authBadge.style.color = '#8fc98f';
        messageInput.disabled = false;
        sendButton.disabled = false;
        authLoginBtn.style.display = 'none';
        authRegisterBtn.style.display = 'none';
        authLogoutBtn.style.display = 'inline-block';
        authStatus.textContent = '✅ в сети';
        authStatus.className = 'auth-status success';
        newChatBtn.style.display = 'inline-block';

        // Если не было чата — переключаем на общий
        if (!currentChatId || currentChatId === 'general') {
          setChat('general', null);
        }

        // Приветствие в общем чате
        if (!localStorage.getItem('apo_welcome_' + user.uid)) {
          const generalRef = ref(database, 'chats/general/messages');
          push(generalRef, {
            text: `🔥 ${user.email} присоединился`,
            uid: 'system'
          }).then(() => localStorage.setItem('apo_welcome_' + user.uid, 'true')).catch(() => {});
        }
      } else {
        currentUser = null;
        authBadge.textContent = '✦ войдите';
        authBadge.style.color = '#6a8f6a';
        messageInput.disabled = true;
        sendButton.disabled = true;
        authLoginBtn.style.display = 'inline-block';
        authRegisterBtn.style.display = 'inline-block';
        authLogoutBtn.style.display = 'none';
        authStatus.textContent = 'введите почту и пароль';
        authStatus.className = 'auth-status';
        newChatBtn.style.display = 'none';
        setChat('general', null);
        messageContainer.innerHTML = '<div class="system-message">войдите, чтобы писать</div>';
      }
    }

    authRegisterBtn.addEventListener('click', () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) {
        authStatus.textContent = '⚠️ заполните поля';
        authStatus.className = 'auth-status error';
        return;
      }
      if (password.length < 6) {
        authStatus.textContent = '⚠️ пароль >= 6 символов';
        authStatus.className = 'auth-status error';
        return;
      }
      createUserWithEmailAndPassword(auth, email, password)
        .then((cred) => {
          authStatus.textContent = '✅ регистрация успешна';
          authStatus.className = 'auth-status success';
          setAuthUI(cred.user);
        })
        .catch((error) => {
          authStatus.textContent = '⚠️ ' + error.message;
          authStatus.className = 'auth-status error';
        });
    });

    authLoginBtn.addEventListener('click', () => {
      const email = authEmail.value.trim();
      const password = authPassword.value.trim();
      if (!email || !password) {
        authStatus.textContent = '⚠️ заполните поля';
        authStatus.className = 'auth-status error';
        return;
      }
      signInWithEmailAndPassword(auth, email, password)
        .then((cred) => {
          authStatus.textContent = '✅ вход выполнен';
          authStatus.className = 'auth-status success';
          setAuthUI(cred.user);
        })
        .catch((error) => {
          authStatus.textContent = '⚠️ ' + error.message;
          authStatus.className = 'auth-status error';
        });
    });

    authLogoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        authStatus.textContent = '👋 вы вышли';
        authStatus.className = 'auth-status';
        setAuthUI(null);
      });
    });

    onAuthStateChanged(auth, (user) => {
      setAuthUI(user);
    });

    // Старт с общим чатом
    setTimeout(() => {
      if (!currentUser) {
        setChat('general', null);
      }
    }, 100);

    console.log('🌿 APOAPSIS · личные чаты');
  </script>
</body>
</html>
