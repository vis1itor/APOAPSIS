<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoapsis</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #0a0a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 2em;
            background: linear-gradient(145deg, #E0F4FF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sub {
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.8em;
            margin-bottom: 20px;
        }
        input,
        textarea {
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0 10px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
            outline: none;
        }
        input:focus,
        textarea:focus {
            border-color: rgba(0, 180, 255, 0.2);
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-cyan {
            background: linear-gradient(145deg, #00D4FF, #0099CC);
            color: #05050f;
        }
        .btn-cyan:hover {
            transform: scale(1.01);
        }
        .btn-ghost {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .btn-danger {
            background: rgba(255, 50, 50, 0.08);
            color: #ff5555;
            border: 1px solid rgba(255, 50, 50, 0.05);
        }
        .btn-danger:hover {
            background: rgba(255, 50, 50, 0.15);
        }
        .btn-small {
            padding: 6px 12px;
            width: auto;
            font-size: 0.8em;
            display: inline-block;
            margin: 2px;
        }
        .message {
            text-align: center;
            margin: 8px 0;
            font-size: 0.85em;
        }
        .message.success {
            color: #66ddbb;
        }
        .message.error {
            color: #ff5555;
        }
        .hidden {
            display: none !important;
        }
        .chat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 10px;
            margin: 4px 0;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.02);
            transition: 0.2s;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .chat-item.active {
            border-color: rgba(0, 180, 255, 0.2);
            background: rgba(0, 180, 255, 0.05);
        }
        .chat-item .name {
            font-weight: 600;
        }
        .chat-item .last {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.2);
        }
        .chat-messages {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            margin: 8px 0;
        }
        .msg {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 10px;
            max-width: 80%;
        }
        .msg.sent {
            background: rgba(0, 180, 255, 0.1);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .msg.received {
            background: rgba(255, 255, 255, 0.04);
            border-bottom-left-radius: 4px;
        }
        .msg .time {
            font-size: 0.6em;
            color: rgba(255, 255, 255, 0.15);
            display: block;
            text-align: right;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .input-row input {
            flex: 1;
            margin: 0;
        }
        .input-row button {
            width: auto;
            padding: 10px 20px;
            margin: 0;
        }
        .flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .flex button {
            flex: 1;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== АВТОРИЗАЦИЯ ===== -->
        <div id="authBlock">
            <h1>APOAPSIS</h1>
            <div class="sub">точка на орбите</div>
            <input type="email" id="emailInput" placeholder="почта" />
            <input type="password" id="passInput" placeholder="пароль" />
            <button class="btn-cyan" id="registerBtn">зарегистрироваться</button>
            <button class="btn-ghost" id="loginBtn">войти</button>
            <div id="authMsg" class="message"></div>
        </div>

        <!-- ===== МЕССЕНДЖЕР ===== -->
        <div id="appBlock" class="hidden">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div>
                    <span style="color:#00D4FF;font-weight:700;" id="userDisplay">user</span>
                    <span style="color:rgba(255,255,255,0.15);font-size:0.7em;">онлайн</span>
                </div>
                <button class="btn-danger btn-small" id="logoutBtn">выйти</button>
            </div>

            <!-- СПИСОК ЧАТОВ -->
            <div id="chatList"></div>

            <!-- КНОПКА НОВОГО ЧАТА -->
            <button class="btn-ghost btn-small" id="newChatBtn" style="width:100%;margin:6px 0;">➕ новый чат</button>

            <!-- ОКНО ЧАТА -->
            <div id="chatWindow" class="hidden">
                <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px 0;">
                    <span style="font-weight:600;" id="chatPartnerName">Чат</span>
                    <button class="btn-danger btn-small" id="closeChatBtn">✕</button>
                </div>
                <div class="chat-messages" id="messagesContainer">
                    <div style="text-align:center;color:rgba(255,255,255,0.1);padding:20px 0;">нет сообщений</div>
                </div>
                <div class="input-row">
                    <input type="text" id="msgInput" placeholder="сообщение..." />
                    <button class="btn-cyan" id="sendBtn">отправить</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ============================================================
        // 1. КОНФИГ FIREBASE
        // ============================================================
        var firebaseConfig = {
            apiKey: "AIzaSyCUsMTVo7kIgPdafanIhIHSnz8vyApJODo",
            authDomain: "nebula-93d4f.firebaseapp.com",
            databaseURL: "https://nebula-93d4f-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "nebula-93d4f",
            storageBucket: "nebula-93d4f.firebasestorage.app",
            messagingSenderId: "322363940406",
            appId: "1:322363940406:web:0803c7c10387ebb8fb8297",
            measurementId: "G-SMGGRTYCV0"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        // ============================================================
        // 2. ПЕРЕМЕННЫЕ
        // ============================================================
        var currentUser = null;
        var currentUserEmail = null;
        var currentChatId = null;
        var currentChatPartner = null;
        var chatUnsubscribe = null;
        var allChats = [];
        var allUsers = {};

        // ============================================================
        // 3. ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function getChatId(user1, user2) {
            var arr = [user1, user2];
            arr.sort();
            return arr.join('_');
        }

        function notify(text) {
            var el = document.createElement('div');
            el.style.cssText =
                'position:fixed;bottom:20px;right:20px;background:rgba(13,13,43,0.95);color:#E0F4FF;padding:10px 18px;border-radius:14px;border:1px solid rgba(0,180,255,0.05);box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:999;animation:slideIn 0.3s ease;max-width:280px;font-family:Arial;font-size:0.85em;';
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 3500);
        }

        // ============================================================
        // 4. АВТОРИЗАЦИЯ
        // ============================================================
        function showApp() {
            document.getElementById('authBlock').classList.add('hidden');
            document.getElementById('appBlock').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = currentUserEmail;
            loadChats();
        }

        function registerUser() {
            var email = document.getElementById('emailInput').value.trim();
            var pass = document.getElementById('passInput').value.trim();
            var msg = document.getElementById('authMsg');

            if (!email || !pass) {
                msg.innerText = '❌ заполни все поля';
                msg.className = 'message error';
                return;
            }
            if (pass.length < 6) {
                msg.innerText = '❌ пароль минимум 6 символов';
                msg.className = 'message error';
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass)
                .then(function(userCredential) {
                    var user = userCredential.user;
                    return db.collection('users').doc(user.uid).set({
                        email: email,
                        createdAt: new Date().toISOString()
                    });
                })
                .then(function() {
                    msg.innerText = '✅ регистрация успешна! войди.';
                    msg.className = 'message success';
                })
                .catch(function(error) {
                    msg.innerText = '❌ ' + error.message;
                    msg.className = 'message error';
                });
        }

        function loginUser() {
            var email = document.getElementById('emailInput').value.trim();
            var pass = document.getElementById('passInput').value.trim();
            var msg = document.getElementById('authMsg');

            if (!email || !pass) {
                msg.innerText = '❌ заполни все поля';
                msg.className = 'message error';
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
                .then(function(userCredential) {
                    currentUser = userCredential.user.uid;
                    currentUserEmail = userCredential.user.email;
                    msg.innerText = '';
                    showApp();
                    notify('👋 добро пожаловать');
                })
                .catch(function(error) {
                    msg.innerText = '❌ ' + error.message;
                    msg.className = 'message error';
                });
        }

        function logoutUser() {
            if (chatUnsubscribe) { chatUnsubscribe();
                chatUnsubscribe = null; }
            auth.signOut();
            currentUser = null;
            currentUserEmail = null;
            currentChatId = null;
            currentChatPartner = null;
            document.getElementById('authBlock').classList.remove('hidden');
            document.getElementById('appBlock').classList.add('hidden');
            document.getElementById('chatWindow').classList.add('hidden');
            document.getElementById('chatList').innerHTML = '';
        }

        // ============================================================
        // 5. ЧАТЫ
        // ============================================================
        function loadChats() {
            if (!currentUser) return;

            db.collection('users').get()
                .then(function(snapshot) {
                    allUsers = {};
                    snapshot.forEach(function(doc) {
                        allUsers[doc.id] = doc.data();
                    });
                    return db.collection('chats')
                        .where('participants', 'array-contains', currentUser)
                        .get();
                })
                .then(function(snapshot) {
                    allChats = [];
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        data.id = doc.id;
                        allChats.push(data);
                    });
                    allChats.sort(function(a, b) {
                        var aTime = a.lastMessageTime || a.createdAt || 0;
                        var bTime = b.lastMessageTime || b.createdAt || 0;
                        if (aTime < bTime) return 1;
                        if (aTime > bTime) return -1;
                        return 0;
                    });
                    renderChats();
                })
                .catch(function(error) {
                    console.error(error);
                });
        }

        function renderChats() {
            var container = document.getElementById('chatList');
            if (allChats.length === 0) {
                container.innerHTML = '<div style="color:rgba(255,255,255,0.1);text-align:center;padding:16px 0;">нет чатов</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < allChats.length; i++) {
                var chat = allChats[i];
                var partnerId = chat.participants.find(function(p) { return p !== currentUser; });
                var partnerData = allUsers[partnerId] || {};
                var partnerEmail = partnerData.email || partnerId || 'unknown';
                var isActive = chat.id === currentChatId;
                var lastMsg = chat.lastMessage || 'нет сообщений';

                html += '<div class="chat-item ' + (isActive ? 'active' : '') + '" onclick="openChat(\'' + chat.id +
                    '\', \'' + partnerId + '\')">' +
                    '<div><div class="name">' + partnerEmail + '</div>' +
                    '<div class="last">' + lastMsg + '</div></div>' +
                    '</div>';
            }
            container.innerHTML = html;
        }

        // ============================================================
        // 6. ОТКРЫТЬ ЧАТ
        // ============================================================
        function openChat(chatId, partnerId) {
            if (chatUnsubscribe) { chatUnsubscribe(); }

            currentChatId = chatId;
            currentChatPartner = partnerId;

            var partnerData = allUsers[partnerId] || {};
            var partnerEmail = partnerData.email || partnerId || 'Неизвестный';

            document.getElementById('chatPartnerName').innerText = partnerEmail;
            document.getElementById('chatWindow').classList.remove('hidden');

            renderChats();
            loadMessages(chatId);
        }

        function closeChat() {
            if (chatUnsubscribe) { chatUnsubscribe();
                chatUnsubscribe = null; }
            currentChatId = null;
            currentChatPartner = null;
            document.getElementById('chatWindow').classList.add('hidden');
            renderChats();
        }

        // ============================================================
        // 7. СООБЩЕНИЯ
        // ============================================================
        function loadMessages(chatId) {
            if (chatUnsubscribe) { chatUnsubscribe(); }

            chatUnsubscribe = db.collection('chats').doc(chatId)
                .onSnapshot(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        var messages = data.messages || [];
                        renderMessages(messages);
                    }
                }, function(error) {
                    console.error(error);
                });
        }

        function renderMessages(messages) {
            var container = document.getElementById('messagesContainer');

            if (!messages || messages.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.1);padding:20px 0;">нет сообщений</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < messages.length; i++) {
                var msg = messages[i];
                var isMe = msg.sender === currentUser;
                var time = msg.time ? new Date(msg.time).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) :
                '';
                html += '<div class="msg ' + (isMe ? 'sent' : 'received') + '">' +
                    msg.text +
                    '<span class="time">' + time + '</span>' +
                    '</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            var input = document.getElementById('msgInput');
            var text = input.value.trim();
            if (!text || !currentChatId) return;

            var chatRef = db.collection('chats').doc(currentChatId);

            chatRef.get()
                .then(function(doc) {
                    var data = doc.data() || { messages: [] };
                    var messages = data.messages || [];
                    messages.push({
                        sender: currentUser,
                        text: text,
                        time: new Date().toISOString()
                    });

                    return chatRef.update({
                        messages: messages,
                        lastMessage: text,
                        lastMessageTime: new Date().toISOString()
                    });
                })
                .then(function() {
                    input.value = '';
                    notify('💬 отправлено');
                    loadChats();
                })
                .catch(function(error) {
                    notify('❌ ошибка');
                    console.error(error);
                });
        }

        // ============================================================
        // 8. НОВЫЙ ЧАТ
        // ============================================================
        function createNewChat() {
            var partnerEmail = prompt('Введите email пользователя:');
            if (!partnerEmail) return;

            db.collection('users').where('email', '==', partnerEmail).get()
                .then(function(snapshot) {
                    if (snapshot.empty) {
                        notify('❌ пользователь не найден');
                        return;
                    }
                    var userDoc = snapshot.docs[0];
                    var partnerId = userDoc.id;

                    if (partnerId === currentUser) {
                        notify('❌ нельзя с собой');
                        return;
                    }

                    var chatId = getChatId(currentUser, partnerId);

                    return db.collection('chats').doc(chatId).get()
                        .then(function(doc) {
                            if (doc.exists) {
                                notify('✅ чат уже существует');
                                openChat(chatId, partnerId);
                                return;
                            }
                            return db.collection('chats').doc(chatId).set({
                                participants: [currentUser, partnerId],
                                createdAt: new Date().toISOString(),
                                messages: [],
                                lastMessage: '',
                                lastMessageTime: null
                            });
                        });
                })
                .then(function() {
                    if (currentChatId) {
                        notify('✅ чат создан');
                        loadChats();
                    }
                })
                .catch(function(error) {
                    notify('❌ ошибка: ' + error.message);
                    console.error(error);
                });
        }

        // ============================================================
        // 9. КНОПКИ
        // ============================================================
        document.getElementById('registerBtn').addEventListener('click', registerUser);
        document.getElementById('loginBtn').addEventListener('click', loginUser);
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('newChatBtn').addEventListener('click', createNewChat);
        document.getElementById('closeChatBtn').addEventListener('click', closeChat);

        document.getElementById('msgInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // ============================================================
        // 10. АВТО-ВХОД
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUser = user.uid;
                currentUserEmail = user.email;
                showApp();
            }
        });
    </script>

</body>
</html>
