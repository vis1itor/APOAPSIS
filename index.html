<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Звонки · Минимальная версия</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: #0b0e14; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .container {
      width: 100%; max-width: 400px; background: rgba(20,25,32,0.9);
      backdrop-filter: blur(14px); border-radius: 24px;
      border: 1px solid rgba(0,255,150,0.12); padding: 24px;
      color: #d4e8dd;
    }
    h2 { color: #a0f0c0; margin-bottom: 16px; text-align: center; }
    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 12px; color: #76c9a0; margin-bottom: 4px; }
    .input-group input {
      width: 100%; padding: 10px 14px; background: rgba(10,16,20,0.5);
      border: 1px solid rgba(0,255,150,0.15); border-radius: 12px;
      color: #d4e8dd; font-size: 14px; outline: none;
    }
    .input-group input:focus { border-color: #27e07b; }
    .btn {
      width: 100%; padding: 12px; border: 1px solid rgba(0,255,150,0.2);
      border-radius: 12px; background: rgba(0,220,130,0.1);
      color: #b3f0d0; font-weight: 600; font-size: 15px;
      cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: rgba(0,220,130,0.2); border-color: #2effa0; }
    .btn-danger { border-color: rgba(255,80,80,0.3); color: #ff8a8a; }
    .btn-danger:hover { background: rgba(255,80,80,0.15); }
    .status { text-align: center; padding: 8px; font-size: 13px; color: #76c9a0; margin-top: 8px; }
    .call-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
      display: none; flex-direction: column; align-items: center;
      justify-content: center; z-index: 999; gap: 20px;
    }
    .call-overlay.active { display: flex; }
    .call-avatar { width: 120px; height: 120px; border-radius: 50%; background: #1e2a2e;
      display: flex; align-items: center; justify-content: center;
      border: 3px solid rgba(0,255,150,0.2); color: #a0f0c0; font-size: 48px; }
    .call-name { color: #eef5f0; font-size: 24px; font-weight: 600; }
    .call-status { color: #76c9a0; font-size: 14px; }
    .call-actions { display: flex; gap: 30px; margin-top: 20px; }
    .call-btn {
      width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 28px;
      cursor: pointer; transition: 0.2s;
    }
    .call-btn:hover { transform: scale(1.05); }
    .call-btn.end-call { background: rgba(255,80,80,0.2); border: 2px solid rgba(255,80,80,0.3); color: #ff6b6b; }
    .call-btn.answer-call { background: rgba(0,220,130,0.2); border: 2px solid rgba(0,255,150,0.3); color: #27e07b; }
    .call-log { 
      margin-top: 12px; padding: 8px; background: rgba(0,0,0,0.3);
      border-radius: 8px; font-size: 11px; color: #5a7a6a;
      max-height: 80px; overflow-y: auto; font-family: monospace;
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <h2>📞 WebRTC Звонки</h2>
  
  <div class="input-group">
    <label>Ваш Email</label>
    <input type="email" id="myEmail" placeholder="user@example.com" value="test1@test.com">
  </div>
  <button class="btn" id="loginBtn">🔑 Войти</button>

  <div id="callSection" style="display:none; margin-top:16px;">
    <div class="input-group">
      <label>Кому позвонить (Email)</label>
      <input type="email" id="targetEmail" placeholder="friend@example.com" value="test2@test.com">
    </div>
    <button class="btn" id="callBtn">📞 Позвонить</button>
    <button class="btn btn-danger" id="hangupBtn" style="display:none;">📞 Завершить</button>
  </div>

  <div class="status" id="status">Не авторизован</div>
  <div class="call-log" id="log"></div>
</div>

<!-- Call Overlay -->
<div class="call-overlay" id="callOverlay">
  <div class="call-avatar" id="callAvatar">👤</div>
  <div class="call-name" id="callName">Звонок</div>
  <div class="call-status" id="callStatus">Соединение...</div>
  <div class="call-actions">
    <button class="call-btn end-call" id="endCallBtn">📞</button>
    <button class="call-btn answer-call" id="answerCallBtn" style="display:none;">📞</button>
  </div>
</div>

<script>
  // Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBIgCjEVT5BsPbGZqEARSDGvYv_9LclFY8",
    authDomain: "apoapsis-a9024.firebaseapp.com",
    databaseURL: "https://apoapsis-a9024-default-rtdb.firebaseio.com",
    projectId: "apoapsis-a9024",
    storageBucket: "apoapsis-a9024.firebasestorage.app",
    messagingSenderId: "264187106751",
    appId: "1:264187106751:web:712670b22bbaeeb7bcfd0a"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  // DOM
  const myEmail = document.getElementById('myEmail');
  const targetEmail = document.getElementById('targetEmail');
  const loginBtn = document.getElementById('loginBtn');
  const callBtn = document.getElementById('callBtn');
  const hangupBtn = document.getElementById('hangupBtn');
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const callSection = document.getElementById('callSection');
  const callOverlay = document.getElementById('callOverlay');
  const callAvatar = document.getElementById('callAvatar');
  const callName = document.getElementById('callName');
  const callStatus = document.getElementById('callStatus');
  const endCallBtn = document.getElementById('endCallBtn');
  const answerCallBtn = document.getElementById('answerCallBtn');

  // State
  let currentUser = null;
  let peerConnection = null;
  let localStream = null;
  let remoteStream = null;
  let isInCall = false;
  let isCaller = false;
  let callId = null;
  let callRef = null;
  let callListener = null;
  let signalListener = null;
  let isEnding = false;

  function log(msg) {
    logEl.textContent += '\n' + new Date().toLocaleTimeString() + ' ' + msg;
    logEl.scrollTop = logEl.scrollHeight;
    console.log(msg);
  }

  // --- Аудио ---
  let audioEl = null;
  function getAudio() {
    if (!audioEl) {
      audioEl = document.createElement('audio');
      audioEl.autoplay = true;
      audioEl.volume = 1.0;
      audioEl.style.display = 'none';
      document.body.appendChild(audioEl);
    }
    return audioEl;
  }

  // --- Вход ---
  loginBtn.onclick = async () => {
    const email = myEmail.value.trim();
    if (!email || !email.includes('@')) {
      statusEl.textContent = '❌ Введите корректный Email';
      return;
    }
    try {
      statusEl.textContent = '⏳ Вход...';
      // Простая имитация входа
      const userCred = await auth.signInWithEmailAndPassword(email, '123456');
      currentUser = userCred.user;
      statusEl.textContent = '✅ Вошли как ' + email;
      callSection.style.display = 'block';
      loginBtn.textContent = '🚪 Выйти';
      log('✅ Авторизован: ' + email);
      
      // Сохраняем email в базе для поиска
      await db.ref('users/' + userCred.user.uid + '/email').set(email);
      
      // Слушаем входящие звонки
      listenForCalls();
    } catch(e) {
      if (e.code === 'auth/user-not-found') {
        // Регистрируем
        try {
          const userCred = await auth.createUserWithEmailAndPassword(email, '123456');
          currentUser = userCred.user;
          await db.ref('users/' + userCred.user.uid + '/email').set(email);
          statusEl.textContent = '✅ Зарегистрировались и вошли как ' + email;
          callSection.style.display = 'block';
          loginBtn.textContent = '🚪 Выйти';
          log('✅ Создан аккаунт: ' + email);
          listenForCalls();
        } catch(err) {
          statusEl.textContent = '❌ Ошибка: ' + err.message;
          log('❌ Ошибка регистрации: ' + err.message);
        }
      } else {
        statusEl.textContent = '❌ Ошибка: ' + e.message;
        log('❌ Ошибка: ' + e.message);
      }
    }
  };

  // --- Звонок ---
  callBtn.onclick = startCall;

  function startCall() {
    const target = targetEmail.value.trim();
    if (!target || !target.includes('@')) {
      statusEl.textContent = '❌ Введите Email получателя';
      return;
    }
    if (!currentUser) {
      statusEl.textContent = '❌ Сначала войдите';
      return;
    }
    if (isInCall) return;

    log('📞 Звонок на ' + target);
    isCaller = true;
    isInCall = true;
    isEnding = false;

    callOverlay.classList.add('active');
    callAvatar.textContent = '👤';
    callName.textContent = target.split('@')[0];
    callStatus.textContent = 'Вызов...';
    answerCallBtn.style.display = 'none';
    endCallBtn.style.display = 'flex';

    // Создаем запись звонка
    callId = Date.now() + '_' + Math.random().toString(36).substr(2, 5);
    callRef = db.ref('calls/' + callId);
    callRef.set({
      from: currentUser.email,
      to: target,
      status: 'calling',
      timestamp: Date.now()
    });

    callListener = callRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && !isEnding) {
        log('📞 Статус звонка: ' + data.status);
        if (data.status === 'answered') {
          callStatus.textContent = 'В разговоре...';
          setupPeerConnection(true);
        } else if (data.status === 'ended' && !isEnding) {
          endCall();
        }
      }
    });

    // Таймаут
    setTimeout(() => {
      if (isInCall && !isEnding) {
        callStatus.textContent = 'Нет ответа';
        setTimeout(() => { if (isInCall && !isEnding) endCall(); }, 1500);
      }
    }, 25000);
  }

  function answerCall() {
    log('📞 Ответ на звонок');
    isEnding = false;
    answerCallBtn.style.display = 'none';
    endCallBtn.style.display = 'flex';
    callStatus.textContent = 'В разговоре...';
    if (callRef) {
      callRef.update({ status: 'answered' });
    }
    setupPeerConnection(false);
  }

  function setupPeerConnection(isCallerFlag) {
    if (peerConnection) {
      peerConnection.close();
      peerConnection = null;
    }

    const audio = getAudio();
    peerConnection = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });

    // Микрофон
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
      .then(stream => {
        localStream = stream;
        stream.getTracks().forEach(track => {
          if (peerConnection) peerConnection.addTrack(track, stream);
        });
        log('✅ Микрофон активен');
      })
      .catch(err => {
        log('❌ Ошибка микрофона: ' + err.message);
        callStatus.textContent = '⚠️ Без микрофона';
      });

    // Входящий аудио
    peerConnection.ontrack = (event) => {
      log('📡 Получен аудио трек!');
      if (event.streams && event.streams.length > 0) {
        remoteStream = event.streams[0];
        if (audio) {
          audio.srcObject = remoteStream;
          audio.play()
            .then(() => {
              log('🔊 Аудио воспроизводится!');
              callStatus.textContent = 'В разговоре... 🔊';
            })
            .catch(err => {
              log('❌ Ошибка воспроизведения: ' + err.message);
            });
        }
      }
    };

    peerConnection.onicecandidate = (event) => {
      if (event.candidate && callRef && !isEnding) {
        callRef.update({ candidate: event.candidate });
      }
    };

    peerConnection.onconnectionstatechange = () => {
      log('🔄 Состояние: ' + peerConnection.connectionState);
      if (!isEnding) {
        if (peerConnection.connectionState === 'connected') {
          callStatus.textContent = 'В разговоре... 🔊';
        } else if (peerConnection.connectionState === 'disconnected' || 
                   peerConnection.connectionState === 'failed') {
          endCall();
        }
      }
    };

    const callRefObj = db.ref('calls/' + callId);
    
    if (isCallerFlag) {
      peerConnection.createOffer()
        .then(offer => peerConnection.setLocalDescription(offer))
        .then(() => {
          if (callRef && !isEnding) {
            callRefObj.update({ offer: peerConnection.localDescription });
          }
        })
        .catch(err => log('Offer error: ' + err.message));
    }

    signalListener = callRefObj.on('child_changed', (snapshot) => {
      const data = snapshot.val();
      if (!peerConnection || isEnding) return;

      if (data && data.offer && !isCallerFlag) {
        log('📥 Получен offer');
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer))
          .then(() => peerConnection.createAnswer())
          .then(answer => peerConnection.setLocalDescription(answer))
          .then(() => {
            if (callRef && !isEnding) {
              callRefObj.update({ answer: peerConnection.localDescription });
            }
          })
          .catch(err => log('Answer error: ' + err.message));
      }
      
      if (data && data.answer && isCallerFlag) {
        log('📥 Получен answer');
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer))
          .catch(err => log('Set remote error: ' + err.message));
      }

      if (data && data.candidate) {
        log('📥 Получен ICE кандидат');
        peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate))
          .catch(err => log('Add ICE error: ' + err.message));
      }
    });
  }

  function endCall() {
    if (isEnding) return;
    isEnding = true;
    log('📞 Завершение звонка');
    
    isInCall = false;
    isCaller = false;
    callOverlay.classList.remove('active');
    answerCallBtn.style.display = 'none';
    endCallBtn.style.display = 'flex';
    
    if (peerConnection) {
      try { peerConnection.close(); } catch(e) {}
      peerConnection = null;
    }
    if (localStream) {
      try { localStream.getTracks().forEach(t => t.stop()); } catch(e) {}
      localStream = null;
    }
    if (remoteStream) {
      try { remoteStream.getTracks().forEach(t => t.stop()); } catch(e) {}
      remoteStream = null;
    }
    if (audioEl) {
      try { audioEl.srcObject = null; audioEl.pause(); } catch(e) {}
    }
    
    if (callRef) {
      try {
        callRef.update({ status: 'ended' });
        setTimeout(() => { try { callRef.remove(); } catch(e) {} }, 500);
      } catch(e) {}
      callRef = null;
    }
    
    if (callListener) {
      try { callListener(); } catch(e) {}
      callListener = null;
    }
    
    if (signalListener) {
      try {
        if (callId) {
          db.ref('calls/' + callId).off('child_changed', signalListener);
        }
      } catch(e) {}
      signalListener = null;
    }
    
    callId = null;
    isEnding = false;
    statusEl.textContent = 'Звонок завершен';
  }

  // --- Входящие звонки ---
  function listenForCalls() {
    if (!currentUser) return;
    const callsRef = db.ref('calls');
    callsRef.orderByChild('to').equalTo(currentUser.email).on('child_added', (snapshot) => {
      const data = snapshot.val();
      if (data && data.status === 'calling' && !isInCall) {
        callId = snapshot.key;
        callRef = db.ref('calls/' + callId);
        
        callOverlay.classList.add('active');
        callAvatar.textContent = '👤';
        callName.textContent = data.from.split('@')[0];
        callStatus.textContent = 'Входящий звонок... 📞';
        endCallBtn.style.display = 'none';
        answerCallBtn.style.display = 'flex';
        
        isCaller = false;
        isInCall = true;
        isEnding = false;
        
        log('📞 Входящий звонок от ' + data.from);
        
        setTimeout(() => {
          if (isInCall && !isEnding && callOverlay.classList.contains('active')) {
            endCall();
            log('⏰ Звонок пропущен');
          }
        }, 20000);
      }
    });
  }

  // Кнопки
  endCallBtn.onclick = endCall;
  answerCallBtn.onclick = answerCall;

  hangupBtn.onclick = endCall;

  // Выход
  loginBtn.onclick = async () => {
    if (currentUser) {
      if (isInCall) endCall();
      await auth.signOut();
      currentUser = null;
      statusEl.textContent = '❌ Вышли';
      callSection.style.display = 'none';
      loginBtn.textContent = '🔑 Войти';
      log('❌ Выход');
      return;
    }
    // Логика входа выше
  };

  // Обработка переключения кнопки
  auth.onAuthStateChanged(user => {
    if (!user && currentUser) {
      currentUser = null;
      statusEl.textContent = '❌ Вышли';
      callSection.style.display = 'none';
      loginBtn.textContent = '🔑 Войти';
    }
  });

  log('✅ Приложение загружено');
  log('📝 Войдите, чтобы начать');
</script>
</body>
</html>
