<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoapsis — мессенджер</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 20% 50%, #0a0a1a, #04040a 70%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .glass-container {
            max-width: 900px;
            width: 100%;
            height: 650px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .glass-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.02), transparent 60%);
            pointer-events: none;
        }

        /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
        .sidebar {
            width: 300px;
            min-width: 300px;
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .sidebar-header .logo {
            font-size: 1.4em;
            font-weight: 900;
            background: linear-gradient(145deg, #E0F4FF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .sidebar-header .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 180, 255, 0.1);
            border: 2px solid rgba(0, 180, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            color: #00D4FF;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .sidebar-header .user-avatar:hover {
            background: rgba(0, 180, 255, 0.2);
            transform: scale(1.05);
        }

        .search-chat {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #E0F4FF;
            font-size: 0.85em;
            outline: none;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
        }

        .search-chat::placeholder {
            color: rgba(224, 244, 255, 0.15);
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chat-list::-webkit-scrollbar {
            width: 4px;
        }
        .chat-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            color: rgba(224, 244, 255, 0.5);
            font-family: 'Inter', sans-serif;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.03);
            color: #E0F4FF;
        }

        .chat-item.active {
            background: rgba(0, 180, 255, 0.05);
            border: 1px solid rgba(0, 180, 255, 0.04);
            color: #E0F4FF;
        }

        .chat-item .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-item .info {
            flex: 1;
            min-width: 0;
        }

        .chat-item .info .name {
            font-weight: 600;
            font-size: 0.9em;
        }

        .chat-item .info .last-msg {
            font-size: 0.75em;
            color: rgba(224, 244, 255, 0.2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item .time {
            font-size: 0.6em;
            color: rgba(224, 244, 255, 0.12);
            flex-shrink: 0;
        }

        .chat-item .unread {
            background: #00D4FF;
            color: #05050f;
            font-size: 0.6em;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .chat-item .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            flex-shrink: 0;
        }

        /* ===== ОСНОВНАЯ ОБЛАСТЬ ===== */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            min-width: 0;
        }

        .chat-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-header .name {
            font-weight: 600;
            font-size: 1em;
            color: #E0F4FF;
        }

        .chat-header .status {
            font-size: 0.7em;
            color: rgba(224, 244, 255, 0.2);
        }

        .chat-header .online {
            color: #4caf50;
        }

        .chat-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9em;
            line-height: 1.4;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .message.sent {
            align-self: flex-end;
            background: rgba(0, 180, 255, 0.1);
            border: 1px solid rgba(0, 180, 255, 0.05);
            color: #E0F4FF;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(224, 244, 255, 0.7);
            border-bottom-left-radius: 4px;
        }

        .message .msg-time {
            font-size: 0.6em;
            color: rgba(224, 244, 255, 0.12);
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(224, 244, 255, 0.06);
            text-align: center;
            padding: 20px;
        }

        .empty-chat .icon {
            font-size: 4em;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        .empty-chat .title {
            font-size: 1.2em;
            color: rgba(224, 244, 255, 0.1);
            font-weight: 600;
        }

        .empty-chat .sub {
            font-size: 0.85em;
            color: rgba(224, 244, 255, 0.05);
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 12px 16px 16px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #E0F4FF;
            font-size: 0.9em;
            outline: none;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .chat-input-area input:focus {
            border-color: rgba(0, 180, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-input-area input::placeholder {
            color: rgba(224, 244, 255, 0.12);
        }

        .chat-input-area .send-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(145deg, #00D4FF, #0099CC);
            color: #05050f;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85em;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .chat-input-area .send-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(0, 180, 255, 0.1);
        }

        .chat-input-area .emoji-btn {
            padding: 12px 14px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(224, 244, 255, 0.15);
            cursor: pointer;
            transition: 0.2s;
            font-size: 1.2em;
        }

        .chat-input-area .emoji-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #E0F4FF;
        }

        /* ===== АВТОРИЗАЦИЯ ===== */
        .auth-container {
            max-width: 420px;
            width: 100%;
            padding: 30px 25px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.02), transparent 60%);
            pointer-events: none;
        }

        .auth-container .logo {
            font-size: 2.4em;
            font-weight: 900;
            text-align: center;
            letter-spacing: 2px;
            background: linear-gradient(145deg, #E0F4FF, #00D4FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container .subtitle {
            text-align: center;
            color: rgba(224, 244, 255, 0.2);
            font-size: 0.8em;
            margin-top: 2px;
            margin-bottom: 24px;
            letter-spacing: 4px;
            font-weight: 300;
        }

        .auth-container .glass-input {
            width: 100%;
            padding: 12px 16px;
            margin: 6px 0 12px 0;
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #E0F4FF;
            font-size: 1em;
            transition: 0.2s;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .auth-container .glass-input:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 180, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 180, 255, 0.02);
        }

        .auth-container .glass-input::placeholder {
            color: rgba(224, 244, 255, 0.1);
        }

        .auth-container .glass-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            border-radius: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-container .btn-cyan {
            background: linear-gradient(145deg, #00D4FF, #0099CC);
            color: #05050f;
            box-shadow: 0 8px 24px rgba(0, 180, 255, 0.05);
        }

        .auth-container .btn-cyan:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 36px rgba(0, 180, 255, 0.1);
        }

        .auth-container .btn-ghost {
            background: rgba(255, 255, 255, 0.02);
            color: rgba(224, 244, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .auth-container .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #E0F4FF;
        }

        .auth-container .message {
            text-align: center;
            margin: 8px 0;
            font-size: 0.85em;
        }

        .auth-container .message.success {
            color: #66ddbb;
        }
        .auth-container .message.error {
            color: #ff5555;
        }

        .hidden {
            display: none !important;
        }

        .user-greeting {
            color: rgba(224, 244, 255, 0.4);
            font-size: 0.85em;
            font-family: 'Inter', sans-serif;
        }

        .user-greeting span {
            color: #00D4FF;
            font-weight: 700;
        }

        .logout-btn {
            background: rgba(255, 50, 50, 0.04);
            color: #ff5555;
            border: 1px solid rgba(255, 50, 50, 0.04);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.7em;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .logout-btn:hover {
            background: rgba(255, 50, 50, 0.08);
        }

        .new-chat-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 14px;
            background: rgba(0, 180, 255, 0.05);
            border: 1px solid rgba(0, 180, 255, 0.04);
            color: rgba(224, 244, 255, 0.3);
            font-weight: 600;
            font-size: 0.8em;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            width: 100%;
            margin-top: 8px;
        }

        .new-chat-btn:hover {
            background: rgba(0, 180, 255, 0.08);
            color: #E0F4FF;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 200px;
                min-width: 200px;
                padding: 12px;
            }
            .sidebar-header .logo {
                font-size: 1.1em;
            }
            .glass-container {
                height: 550px;
            }
        }

        @media (max-width: 550px) {
            .glass-container {
                flex-direction: column;
                height: auto;
                max-height: 650px;
            }
            .sidebar {
                width: 100%;
                min-width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                max-height: 180px;
                overflow-y: auto;
            }
            .chat-list {
                flex-direction: row;
                overflow-x: auto;
                gap: 6px;
                padding-bottom: 4px;
            }
            .chat-item {
                flex-shrink: 0;
                width: 120px;
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 8px 10px;
            }
            .chat-item .info .last-msg {
                display: none;
            }
            .chat-item .time {
                display: none;
            }
            .chat-item .unread {
                font-size: 0.5em;
                padding: 1px 6px;
            }
            .chat-messages {
                padding: 10px 12px;
            }
            .message {
                max-width: 85%;
                font-size: 0.85em;
            }
            .sidebar-header .user-avatar {
                width: 32px;
                height: 32px;
                font-size: 0.8em;
            }
            .new-chat-btn {
                font-size: 0.7em;
                padding: 8px 10px;
            }
            .search-chat {
                font-size: 0.75em;
                padding: 8px 12px;
            }
            .chat-input-area .send-btn {
                padding: 10px 14px;
                font-size: 0.75em;
            }
        }
    </style>
</head>
<body>
    <!-- ===== АВТОРИЗАЦИЯ ===== -->
    <div id="authContainer" class="auth-container">
        <div class="logo">APOAPSIS</div>
        <div class="subtitle">точка на орбите</div>

        <input class="glass-input" type="email" id="loginEmail" placeholder="почта" />
        <input class="glass-input" type="password" id="loginPassword" placeholder="пароль" />
        <button class="glass-btn btn-cyan" id="registerBtn">зарегистрироваться</button>
        <button class="glass-btn btn-ghost" id="loginBtn">войти</button>
        <div id="authMessage" class="message"></div>
    </div>

    <!-- ===== МЕССЕНДЖЕР ===== -->
    <div id="messengerContainer" class="glass-container hidden">

        <!-- БОКОВАЯ ПАНЕЛЬ -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">🛰️ APOAPSIS</div>
                <div class="user-avatar" id="userAvatar">V</div>
            </div>

            <div style="display:flex;gap:6px;margin-bottom:8px;">
                <input class="search-chat" type="text" id="searchChats" placeholder="🔍 поиск чатов" oninput="filterChats()" />
            </div>

            <div class="chat-list" id="chatList"></div>

            <button class="new-chat-btn" id="newChatBtn">➕ новый чат</button>
        </div>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <div class="main-chat">

            <!-- ШАПКА ЧАТА -->
            <div class="chat-header" id="chatHeader">
                <div class="avatar" id="chatAvatar" style="background:#00D4FF;">A</div>
                <div style="flex:1;min-width:0;">
                    <div class="name" id="chatName">Выберите чат</div>
                    <div class="status" id="chatStatus">—</div>
                </div>
                <button class="logout-btn" id="logoutBtn">выйти</button>
            </div>

            <!-- СООБЩЕНИЯ -->
            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat">
                    <div class="icon">🛰️</div>
                    <div class="title">Выберите чат</div>
                    <div class="sub">Начните общение</div>
                </div>
            </div>

            <!-- ПОЛЕ ВВОДА -->
            <div class="chat-input-area">
                <button class="emoji-btn" id="emojiBtn">😊</button>
                <input type="text" id="messageInput" placeholder="Сообщение..." />
                <button class="send-btn" id="sendBtn">Отправить</button>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // 1. КОНФИГ FIREBASE (ТВОЙ)
        // ============================================================
        var firebaseConfig = {
            apiKey: "AIzaSyCUsMTVo7kIgPdafanIhIHSnz8vyApJODo",
            authDomain: "nebula-93d4f.firebaseapp.com",
            databaseURL: "https://nebula-93d4f-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "nebula-93d4f",
            storageBucket: "nebula-93d4f.firebasestorage.app",
            messagingSenderId: "322363940406",
            appId: "1:322363940406:web:0803c7c10387ebb8fb8297",
            measurementId: "G-SMGGRTYCV0"
        };

        firebase.initializeApp(firebaseConfig);
        var auth = firebase.auth();
        var db = firebase.firestore();

        // ============================================================
        // 2. ПЕРЕМЕННЫЕ
        // ============================================================
        var currentUser = null;
        var currentUserEmail = null;
        var currentChatId = null;
        var currentChatPartner = null;
        var chatUnsubscribe = null;

        var allChats = [];
        var allUsers = {};

        // ============================================================
        // 3. ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function timeAgo(dateStr) {
            if (!dateStr) return 'только что';
            var now = new Date();
            var then = new Date(dateStr);
            var diff = Math.floor((now - then) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + 'м';
            if (diff < 86400) return Math.floor(diff / 3600) + 'ч';
            if (diff < 172800) return 'вчера';
            return then.toLocaleDateString('ru-RU');
        }

        function getAvatarColor(email) {
            var colors = ['#00D4FF', '#66ddbb', '#66ccff', '#ff9966', '#cc66ff', '#ff6666', '#66ffcc'];
            var hash = 0;
            var str = email || 'anon';
            for (var i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            return colors[Math.abs(hash) % colors.length];
        }

        function getChatId(user1, user2) {
            var arr = [user1, user2];
            arr.sort();
            return arr.join('_');
        }

        function getInitials(email) {
            if (!email) return '?';
            return email.charAt(0).toUpperCase();
        }

        function notify(text) {
            var el = document.createElement('div');
            el.style.cssText =
                'position:fixed;bottom:20px;right:20px;background:rgba(13,13,43,0.95);backdrop-filter:blur(16px);color:#E0F4FF;padding:10px 18px;border-radius:14px;border:1px solid rgba(0,180,255,0.05);box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:999;animation:slideIn 0.3s ease;max-width:280px;font-family:Inter,sans-serif;font-size:0.85em;';
            el.textContent = text;
            document.body.appendChild(el);
            setTimeout(function() { el.remove(); }, 3500);
        }

        // ============================================================
        // 4. АВТОРИЗАЦИЯ
        // ============================================================
        function showMessenger() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('messengerContainer').classList.remove('hidden');
            document.getElementById('userAvatar').innerText = getInitials(currentUserEmail);
            loadChats();
            updateOnlineStatus();
        }

        function registerUser() {
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPassword').value.trim();
            var msg = document.getElementById('authMessage');

            if (!email || !pass) {
                msg.innerText = '❌ заполни все поля';
                msg.className = 'message error';
                return;
            }
            if (pass.length < 6) {
                msg.innerText = '❌ пароль минимум 6 символов';
                msg.className = 'message error';
                return;
            }

            auth.createUserWithEmailAndPassword(email, pass)
                .then(function() {
                    msg.innerText = '✅ регистрация успешна! войди.';
                    msg.className = 'message success';
                })
                .catch(function(error) {
                    msg.innerText = '❌ ' + error.message;
                    msg.className = 'message error';
                });
        }

        function loginUser() {
            var email = document.getElementById('loginEmail').value.trim();
            var pass = document.getElementById('loginPassword').value.trim();
            var msg = document.getElementById('authMessage');

            if (!email || !pass) {
                msg.innerText = '❌ заполни все поля';
                msg.className = 'message error';
                return;
            }

            auth.signInWithEmailAndPassword(email, pass)
                .then(function(userCredential) {
                    currentUser = userCredential.user.uid;
                    currentUserEmail = userCredential.user.email;
                    msg.innerText = '';
                    showMessenger();
                    notify('👋 добро пожаловать');
                })
                .catch(function(error) {
                    msg.innerText = '❌ ' + error.message;
                    msg.className = 'message error';
                });
        }

        function logoutUser() {
            if (chatUnsubscribe) { chatUnsubscribe();
                chatUnsubscribe = null; }
            auth.signOut();
            currentUser = null;
            currentUserEmail = null;
            currentChatId = null;
            currentChatPartner = null;
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('messengerContainer').classList.add('hidden');
        }

        // ============================================================
        // 5. ОНЛАЙН-СТАТУС
        // ============================================================
        function updateOnlineStatus() {
            if (!currentUser) return;
            db.collection('online').doc(currentUser).set({
                uid: currentUser,
                email: currentUserEmail,
                lastSeen: new Date().toISOString(),
                online: true
            }).catch(function() {});

            window.addEventListener('beforeunload', function() {
                db.collection('online').doc(currentUser).set({
                    online: false,
                    lastSeen: new Date().toISOString()
                }).catch(function() {});
            });
        }

        // ============================================================
        // 6. ЗАГРУЗКА ЧАТОВ
        // ============================================================
        function loadChats() {
            if (!currentUser) return;

            db.collection('users').get()
                .then(function(snapshot) {
                    allUsers = {};
                    snapshot.forEach(function(doc) {
                        allUsers[doc.id] = doc.data();
                    });
                    return db.collection('chats')
                        .where('participants', 'array-contains', currentUser)
                        .get();
                })
                .then(function(snapshot) {
                    allChats = [];
                    snapshot.forEach(function(doc) {
                        var data = doc.data();
                        data.id = doc.id;
                        allChats.push(data);
                    });
                    allChats.sort(function(a, b) {
                        var aTime = a.lastMessageTime || a.createdAt || 0;
                        var bTime = b.lastMessageTime || b.createdAt || 0;
                        if (aTime < bTime) return 1;
                        if (aTime > bTime) return -1;
                        return 0;
                    });
                    renderChats();
                    if (currentChatId) {
                        loadMessages(currentChatId);
                    }
                })
                .catch(function(error) {
                    console.error('Ошибка загрузки чатов:', error);
                });
        }

        function renderChats() {
            var container = document.getElementById('chatList');
            if (allChats.length === 0) {
                container.innerHTML =
                    '<div style="color:rgba(224,244,255,0.1);text-align:center;padding:20px 0;font-size:0.8em;">нет чатов</div>';
                return;
            }

            var html = '';
            for (var i = 0; i < allChats.length; i++) {
                var chat = allChats[i];
                var partnerId = chat.participants.find(function(p) { return p !== currentUser; });
                var partnerData = allUsers[partnerId] || {};
                var partnerEmail = partnerData.email || partnerId || 'unknown';
                var color = getAvatarColor(partnerEmail);
                var initial = getInitials(partnerEmail);
                var lastMsg = chat.lastMessage || 'нет сообщений';
                var lastTime = chat.lastMessageTime ? timeAgo(chat.lastMessageTime) : '';
                var isActive = chat.id === currentChatId;
                var unread = chat.unread && chat.unread[currentUser] ? chat.unread[currentUser] : 0;

                html += '<button class="chat-item ' + (isActive ? 'active' : '') + '" onclick="openChat(\'' + chat.id +
                    '\', \'' + partnerId + '\')">' +
                    '<div class="avatar" style="background:' + color + ';">' + initial + '</div>' +
                    '<div class="info">' +
                    '<div class="name">' + partnerEmail + '</div>' +
                    '<div class="last-msg">' + lastMsg + '</div>' +
                    '</div>' +
                    (lastTime ? '<span class="time">' + lastTime + '</span>' : '') +
                    (unread > 0 ? '<span class="unread">' + unread + '</span>' : '') +
                    '</button>';
            }
            container.innerHTML = html;
        }

        function filterChats() {
            var query = document.getElementById('searchChats').value.toLowerCase();
            var items = document.querySelectorAll('.chat-item');
            for (var i = 0; i < items.length; i++) {
                var name = items[i].querySelector('.name');
                if (name) {
                    var text = name.textContent.toLowerCase();
                    items[i].style.display = text.indexOf(query) > -1 ? 'flex' : 'none';
                }
            }
        }

        // ============================================================
        // 7. ОТКРЫТЬ ЧАТ
        // ============================================================
        function openChat(chatId, partnerId) {
            if (chatUnsubscribe) { chatUnsubscribe(); }

            currentChatId = chatId;
            currentChatPartner = partnerId;

            var partnerData = allUsers[partnerId] || {};
            var partnerEmail = partnerData.email || partnerId || 'Неизвестный';
            var color = getAvatarColor(partnerEmail);

            document.getElementById('chatAvatar').style.background = color;
            document.getElementById('chatAvatar').innerText = getInitials(partnerEmail);
            document.getElementById('chatName').innerText = partnerEmail;
            document.getElementById('chatStatus').innerText = 'онлайн';
            document.getElementById('chatStatus').className = 'status online';

            renderChats();
            loadMessages(chatId);
            markAsRead(chatId);
        }

        // ============================================================
        // 8. ЗАГРУЗКА СООБЩЕНИЙ
        // ============================================================
        function loadMessages(chatId) {
            if (chatUnsubscribe) { chatUnsubscribe(); }

            chatUnsubscribe = db.collection('chats').doc(chatId)
                .onSnapshot(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        var messages = data.messages || [];
                        renderMessages(messages);
                        markAsRead(chatId);
                    }
                }, function(error) {
                    console.error('Ошибка загрузки сообщений:', error);
                });
        }

        function renderMessages(messages) {
            var container = document.getElementById('chatMessages');

            if (!messages || messages.length === 0) {
                container.innerHTML =
                    '<div class="empty-chat"><div class="icon">💬</div><div class="title">Нет сообщений</div><div class="sub">Напишите первое</div></div>';
                return;
            }

            var html = '';
            for (var i = 0; i < messages.length; i++) {
                var msg = messages[i];
                var isMe = msg.sender === currentUser;
                var senderName = isMe ? 'я' : (allUsers[msg.sender] ? allUsers[msg.sender].email : msg.sender);
                html += '<div class="message ' + (isMe ? 'sent' : 'received') + '">' +
                    msg.text +
                    '<span class="msg-time">' + timeAgo(msg.time) + '</span>' +
                    '</div>';
            }
            container.innerHTML = html;
            container.scrollTop = container.scrollHeight;
        }

        // ============================================================
        // 9. ОТПРАВКА СООБЩЕНИЙ
        // ============================================================
        function sendMessage() {
            var input = document.getElementById('messageInput');
            var text = input.value.trim();
            if (!text || !currentChatId) return;

            var chatRef = db.collection('chats').doc(currentChatId);

            chatRef.get()
                .then(function(doc) {
                    var data = doc.data() || { messages: [] };
                    var messages = data.messages || [];
                    messages.push({
                        sender: currentUser,
                        text: text,
                        time: new Date().toISOString()
                    });

                    var unread = data.unread || {};
                    var partnerId = data.participants.find(function(p) { return p !== currentUser; });
                    if (partnerId) {
                        unread[partnerId] = (unread[partnerId] || 0) + 1;
                    }

                    return chatRef.update({
                        messages: messages,
                        lastMessage: text,
                        lastMessageTime: new Date().toISOString(),
                        unread: unread
                    });
                })
                .then(function() {
                    input.value = '';
                    notify('💬 сообщение отправлено');
                    loadChats();
                })
                .catch(function(error) {
                    console.error('Ошибка отправки:', error);
                    notify('❌ ошибка отправки');
                });
        }

        // ============================================================
        // 10. ОТМЕТКА О ПРОЧТЕНИИ
        // ============================================================
        function markAsRead(chatId) {
            var chatRef = db.collection('chats').doc(chatId);
            chatRef.get()
                .then(function(doc) {
                    if (doc.exists) {
                        var data = doc.data();
                        var unread = data.unread || {};
                        if (unread[currentUser]) {
                            delete unread[currentUser];
                            chatRef.update({ unread: unread }).catch(function() {});
                        }
                    }
                })
                .catch(function() {});
        }

        // ============================================================
        // 11. СОЗДАНИЕ НОВОГО ЧАТА
        // ============================================================
        function createNewChat() {
            var partnerEmail = prompt('Введите email пользователя:');
            if (!partnerEmail) return;

            db.collection('users').where('email', '==', partnerEmail).get()
                .then(function(snapshot) {
                    if (snapshot.empty) {
                        notify('❌ пользователь не найден');
                        return;
                    }
                    var userDoc = snapshot.docs[0];
                    var partnerId = userDoc.id;

                    if (partnerId === currentUser) {
                        notify('❌ нельзя создать чат с собой');
                        return;
                    }

                    var chatId = getChatId(currentUser, partnerId);

                    return db.collection('chats').doc(chatId).get()
                        .then(function(doc) {
                            if (doc.exists) {
                                notify('✅ чат уже существует');
                                openChat(chatId, partnerId);
                                return;
                            }
                            return db.collection('chats').doc(chatId).set({
                                participants: [currentUser, partnerId],
                                createdAt: new Date().toISOString(),
                                messages: [],
                                lastMessage: '',
                                lastMessageTime: null,
                                unread: {}
                            });
                        });
                })
                .then(function() {
                    if (currentChatId) {
                        notify('✅ чат создан');
                        loadChats();
                    }
                })
                .catch(function(error) {
                    console.error('Ошибка создания чата:', error);
                    notify('❌ ошибка: ' + error.message);
                });
        }

        // ============================================================
        // 12. ПРИВЯЗКА КНОПОК
        // ============================================================
        document.getElementById('registerBtn').addEventListener('click', registerUser);
        document.getElementById('loginBtn').addEventListener('click', loginUser);
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('newChatBtn').addEventListener('click', createNewChat);

        document.getElementById('messageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        document.getElementById('emojiBtn').addEventListener('click', function() {
            var input = document.getElementById('messageInput');
            var emojis = ['😊', '🔥', '❤️', '😂', '🤔', '👍', '👋', '🛰️', '⭐', '🎮'];
            var randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
            input.value += randomEmoji;
            input.focus();
        });

        // ============================================================
        // 13. АВТО-ВХОД
        // ============================================================
        auth.onAuthStateChanged(function(user) {
            if (user) {
                currentUser = user.uid;
                currentUserEmail = user.email;
                showMessenger();
            } else {
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('messengerContainer').classList.add('hidden');
            }
        });

        setInterval(function() {
            if (currentUser) {
                updateOnlineStatus();
            }
        }, 30000);
    </script>
</body>
</html>
